name: Docs check

# The fast lane for docs-only changes: the main CI job ignores docs paths, so a docs-only PR needs
# something cheap that still runs the guards docs can actually break.
#
# `gen_param_catalog.py --check` IS gated: the hand-maintained search/solve keys were split out of the
# generated PARAMETERS.md into reference/SEARCH_CONFIG_KEYS.md, so the generated file is now 100 %
# generated and the byte-check is meaningful on a clean tree.
#
# It needs `hornlab_mesher` importable because 29 of the 33 `code_ref`s resolve into
# hornlab_mesher.{freeform,profile_formulas,profile_morph,throat_stretch}. Importing ANY submodule
# executes hornlab_mesher/__init__.py, which pulls build/mesher/cad — so the full runtime dependency
# set (gmsh, meshio, numpy, scipy; all wheels) is required, not just `--no-deps`. The MAIN test job
# must NOT install the mesher: that would flip 199 `requires_mesher` tests from skip to run.
#
# The path filter includes the code that drives generation (design params/families/generators,
# examples, the generator itself), so a code-only PR that stales the reference also gets checked.
#
# Also gated: tests/test_param_catalog.py pins `gui/static/param-catalog.v1.json` to the code
# byte-for-byte, and tests/test_config.py pins the config contract.
on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - "docs/**"
      - "**/*.md"
      - "NOTES_FOR_SENIOR.md"
      - "hornlab_search/design/**"
      - "hornlab_search/gui/static/param-catalog.v1.json"
      - "examples/**"
      - "tools/gen_param_catalog.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *paths

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pyyaml pytest
          # Pinned same SHA as pyproject.toml. Full install: the package __init__ imports the
          # mesher/build/cad modules, so gmsh + meshio are needed for `import hornlab_mesher.*`.
          python -m pip install "hornlab-waveguide-mesher @ git+https://github.com/jamescollinharky/hornlab-waveguide-mesher.git@55da4f46d662d8dcd7a9f94a609eeea4009fcd62"
          python -m pip install -e . --no-deps
      - name: Generated docs are byte-identical to the code
        run: python tools/gen_param_catalog.py --check
      - name: Catalog + config contract
        run: python -m pytest -q tests/test_param_catalog.py tests/test_config.py
