name: Docs check

# The fast lane for docs-only changes: the main CI job ignores docs paths, so a docs-only PR needs
# something cheap that still runs the guards docs can actually break.
#
# `gen_param_catalog.py --check` IS gated: the hand-maintained search/solve keys were split out of the
# generated PARAMETERS.md into reference/SEARCH_CONFIG_KEYS.md, so the generated file is now 100 %
# generated and the byte-check is meaningful on a clean tree.
#
# Also gated: tests/test_param_catalog.py pins `gui/static/param-catalog.v1.json` to the code
# byte-for-byte, and tests/test_config.py pins the config contract.
on:
  pull_request:
    paths: ["docs/**", "**/*.md", "NOTES_FOR_SENIOR.md"]
  push:
    branches: [main]
    paths: ["docs/**", "**/*.md", "NOTES_FOR_SENIOR.md"]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pyyaml pytest
          python -m pip install -e . --no-deps
      - name: Generated docs are byte-identical to the code
        run: python tools/gen_param_catalog.py --check
      - name: Catalog + config contract
        run: python -m pytest -q tests/test_param_catalog.py tests/test_config.py
