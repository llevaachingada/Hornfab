schema_version: 1
protocol: bo-study-v1.1
manifest_id: s11-pilot1-cold-vs-warm-native-ath-core-v4
kind: overlay
mode: prepare_only
execution_authorized: false
question: 'Hypothesis (not a claim): on the frozen native__ath_core_v4 task, a diverse warm-start CMA
  arm reaches a lower frozen v4 J at the same 18-valid-screen / 6-verify / 24-new-BEM budget than a broad
  cold CMA arm.  No speedup or improvement is promised; a no-gain or inconclusive result is a valid result.'
notes: 'Both arms use the same physical task, brief, scoring identity, grid, backend and budget policy.  The
  only intentional treatment difference is the CMA initial mean/sigma: cold uses the config seed; warm
  uses search.warm_start from two local native__ath_core_v4 screen runs (same family, objective v4, brief
  and searched knob names).  The overlay is never applied by this tool.'
