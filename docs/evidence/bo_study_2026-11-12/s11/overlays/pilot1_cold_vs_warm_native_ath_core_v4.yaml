    cma_seed: 1235
    screen_valid: 197
    attempts: 201
    screen_seconds_mean: 20.61
    best_stored_j_at_18_valid: 2.9897
analysis_plan:
  primary_endpoint: Frozen v4 J at the declared equal budget (18 valid screen + 6 verify).
  practical_improvement:
    metric: frozen v4 J
    delta: 0.5
    units: J
    direction: lower_is_better
    label: declared_practical_threshold_not_a_speedup_claim
    rationale: 0.5 J is roughly 5% of the native replay median (~10 J in the R0 native scores).  It is
      a declared pilot planning threshold, not a protocol constant or a promise of improvement.
    evidence:
      cma_seed_spread_best_j_at_18_valid: 0.1972
      n_independent_runs: 2
      screen_to_verify_j_shift: *id003
      note: Two seeds give one spread (0.20 J at 18 valid), smaller than the declared 0.5 J threshold;
        the spread is not a paired SD and cannot power a design.  The +0.69..+1.18 J screen-to-verify
        shift means screen and verify J are never mixed in one difference.
  stopping_rule: 'Predeclared paired analysis: d = A - B per seed pair; bootstrap 95% CI of the mean paired
    difference with right-censoring at the declared budget and attempt cap.  Declare a_better only if
    the CI upper bound is below -0.5 J, b_better only if the CI lower bound is above +0.5 J, otherwise
    inconclusive. Fewer than five complete pairs is pilot_only, not a significance guarantee.'
  hypotheses:
  - id: H1
    statement: Diverse warm-start CMA reaches a lower frozen v4 J than broad cold CMA at the same budget
      on native__ath_core_v4.
    label: hypothesis
    falsified_if: The paired CI is inconclusive, or it favors cold at the declared 0.5 J threshold.
    evidence_class: prospective_pilot
  - id: H0
    statement: Warm start and cold start are indistinguishable at this pilot budget.
    label: hypothesis
    falsified_if: The paired CI excludes zero at the declared threshold in either direction.
    evidence_class: prospective_pilot
  results_parser:
    input: search.ndjson + verify directories
    outcome_classes:
    - valid
    - cached_replay
    - cheap_refusal
    - solver_failure
    - pipeline_failure
    - unknown_failure
    - unknown
    failure_to_objective_mapping: none
    unknown_representation: unknown
    censoring: Right-censored at the declared budget/attempt cap; censored pairs remain in the denominator
      and are never counted as reached.
    verify_calls: Reported separately when mode=verify is recorded; otherwise null with verify_calls_unknown=true.
    note: A solver failure, a cheap pre-BEM refusal and an unclassified row are distinct outcomes.  None
      becomes J=1000 or a silent pass.
rollback_and_adoption:
  fail_or_no_gain_rollback:
  - Preparing or validating this manifest changes no production default, objective version, tolerance/weight,
    cache/dataset behavior, GUI/CLI behavior or registration.
  - If the pilot is not scheduled, discard the scratch overlay; no live file was written.
  - If warm start fails to beat cold at the declared threshold, do not adopt it; keep search.warm_start
    absent in production configs.
  - If the pilot is inconclusive, do not silently widen the budget; a larger study is a new revision with
    its own review.
  - A cancellation or crash preserves partial results; unknown attempts are reconciled, never relaunched
    automatically.
  owner_adoption_decisions:
  - id: D1
    decision: Adopt diverse warm start for native__ath_core_v4
    adopt_if: Prospective paired evidence is a_better with CI upper < -0.5 J and no increase in new-BEM
      cost.
    otherwise: Keep cold start; do not change the config.
  - id: D2
    decision: Schedule a larger replication
    adopt_if: Pilot paired variability supports a power plan at the declared 0.5 J delta.
    otherwise: Stop at the pilot; no budget creep or silent threshold change.
  - id: D3
    decision: Keep the protocol 4-finalist + 2-audit verification allocation
    adopt_if: This pilot is not a verification-allocation experiment; the protocol default remains in
      force.
    otherwise: If allocation becomes the question, prepare a separate revision (pilot 2 pattern).
