budget:
  per_arm_per_replicate:
    screen_new_bem: 18
    verify_new_bem: 6
    total_new_bem: 24
    candidate_attempts: 120
    screen_semantics: 'search.budget_counts: valid means the 18 budget units count VALID screen evaluations;
      deterministic refusals consume the 120-attempt cap, not the 18-valid budget.'
    retries_count_against_total: true
  cost_accounting:
    attempts_include_cheap_refusals: true
    cheap_refusal_is_not_a_bem_call: true
    new_bem_calls_separate: true
    verify_calls_separate: true
    retries_reserve_another_unit: true
    unknown_attempt_retains_reservation: true
    cache_hits_not_new_bem: true
    note: An attempt is reserved before dispatch.  A crash/unknown attempt keeps its reservation until
      reconciled; a retry reserves another unit.  Cache hits retain elapsed cost but do not consume a
      new-BEM count.
  replication_aggregate:
    n_pairs: 25
    n_arms: 2
    screen_new_bem: 900
    verify_new_bem: 300
    total_new_bem: 1200
    candidate_attempts: 6000
    planning_only: true
    execution_authorized: false
    note: Arithmetic expansion of the 25-seed paired schedule.  This aggregate is a planning figure only;
      no execution is authorized by this manifest.
