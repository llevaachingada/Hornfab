  brief: examples/briefs/campaign_2026-10-26_v4/native_ath_core_2in_v4.yaml
  backend: beat_cuda
  role: frozen_m2_native_task
  source_caveat_hz: 3957
  source_caveat: '2-inch uniform-piston f11 is approximately 3957 Hz; above it the 300-8000 Hz result
    is a geometry comparison under that excitation, not real 2-inch driver exit behaviour.  Loading weight
    is 0: no loading/efficiency/ distortion claim.'
  cohort:
    census: scratch/bo_m0/s0/ath_census/cohorts.json
    offline_scores: scratch/bo_m0/r0/offline_scores_native_full/offline_scores.json
    native_only: true
    pool_across_configs: false
    note: Frozen native-only identity (config_name == native__ath_core_v4).  The four-config brief family
      is descriptive only and is never pooled for GP or advisory comparisons.  run_id is absent on native
      rows, so independent experiment identity is insufficient_evidence.
  comparability:
    reference_task: native__ath_core_v4
    relation: both arms run the identical frozen task; no cross-task comparison
    shared_identity:
    - config native__ath_core_v4.yaml (source runs differ only in search.cma seed 1234/1235)
    - brief native_ath_core_2in_v4.yaml, objective v4, solve_hash 3181879c7477, mesh_spec d4e306a93337
    caveats:
    - The two warm-start source runs carry different dependency hashes (e3614d0ba5956ded vs 84709bd8e737cca4);
      the strict B2 builder refuses pooling them for a GP (M2 GATE.md 3).
    - Brief-target replay of post-change records regenerates DI terms that disagree with stored runtime
      J (M2 GATE.md 6); pilot endpoints must use the runtime scorer J of the pilot runs themselves, never
      replayed J mixed across code versions.
    - Warm start ranks source rows by their stored runtime J; that ranking is from two different code
      versions.
    pool_across_tasks: false
  pins:
    status: blocked_until_scheduling
    rule: Execution pins are the lib SHAs recorded in each arm run.json at dispatch; both arms of every
      pair must run under one identical pin set, recorded before the first dispatch.  A pin change mid-pilot
      is a new revision.
    checkout_head_at_preparation: 72777950e4f9ec9cde8ae35bd3c65fc492ba6408
    source_run_pins:
    - run: runs/20261027T070736Z-screen-d37d64
      lib_shas: &id001
        hornlab_beat_bem: 760a1ecf6075f5ccdbf97a69874c7f88441e36c1
        hornlab_bempp_bem: 8e6910602ece9abb2e9ce0db7a637f4bedf17f53
        hornlab_mesher: b922e807a5cf10cf732c4557ec0b9b495762afd7
        hornlab_plots: 9e4a6d0dd2ccb6e735dd00233dccccb50d12ed44
        hornlab_search: 10d45b247d8819ee64505a7c6f27df0e8df86c7d
    - run: runs/20261113T004133Z-screen-46b68c
      lib_shas: &id002
        hornlab_beat_bem: 0850ef39b29d7c51f8fbb082184d3784d2ff8bef
        hornlab_bempp_bem: 8e6910602ece9abb2e9ce0db7a637f4bedf17f53
