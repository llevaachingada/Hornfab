  pairing:
    predeclared: true
    method: paired_by_seed_index
    unit: cma_seed_index
    difference_definition: d = A - B (negative => A has lower J / is better)
    same_seed_is_not_shared_candidates: true
    replicate_unit: run_dir
    resume_segments_are_one_replicate: true
    note: Pair seed 5101 in the cold arm with seed 5101 in the warm arm, etc.  A shared CMA seed is not
      proof of shared candidates; pairing is valid only because it is predeclared here.  Resume segments/restarts
      inside one run dir are one replicate, not extra seeds.
  run_order:
    policy: alternate_or_randomize
    note: 'Alternate arm order by seed index (odd cold-first, even warm-first) or predeclare a fixed random
      permutation before the first dispatch and record it.  Never run the two arms concurrently: the GPU
      lane is serial.'
verification_policy:
  verify_new_bem_cap: 6
  audit_rng_seed: 90211
  exclude_duplicates_and_already_verified: true
  shortfall: verify fewer designs and report the shortfall; never duplicate or substitute predicted designs
  selection_rule: Up to four distinct screen finalists by actual frozen J, plus two uniformly selected
    remaining eligible screened designs using the reserved audit RNG seed.  All compared arms receive
    the same policy.
stop_rules:
  budget:
    enabled: true
    rule: Stop dispatching at 24 new BEM calls or 120 new attempts for an arm/seed block, whichever comes
      first; preserve partial results and the attempt journal.
  deadline:
    enabled: true
    deadline_required: true
    deadline_utc: null
    placeholder: true
    rule: A wall deadline must be chosen from comparable measured logs and owner availability before real
      scheduling.  This prepared manifest leaves the deadline as an explicit placeholder.
  cancellation:
    enabled: true
    rule: An explicit cancellation stops future dispatch, cancels only the owned lane/process tree, and
      preserves partial results.  CPU analysis/proposal work never invokes GPU cleanup.
  pool_exhaustion:
    enabled: true
    rule: If the legal candidate pool has no novel candidate after the declared retries, stop with pool_exhausted;
      do not widen bounds or fabricate a design.
  infrastructure_failures:
    enabled: true
    consecutive_threshold: 3
    rule: Stop after three consecutive infrastructure/solver-host failures; an unknown in-flight attempt
      retains its reservation and is reconciled, not relaunched automatically.
  stale_package:
    enabled: true
    rule: Stop if the manifest revision/config hash no longer matches the approved package; a resumed
      package reconciles all prior attempts first.
lane_ownership:
  primary: gpu
  gpu:
    backend: beat_cuda
    lock: existing GPU solve lock (search/gpulock.py)
    worker_dir: runs/lanes/gpu/workers
    one_cuda_solve_at_a_time: true
    no_cross_lane_cleanup: true
    note: The study runner must own the GPU lock for the full serial run.  Never clean hosts from another
      or an unknown lane.
  cpu_if_beat_cpu:
    backend: beat_cpu
    lock: runs/.cpu.lane.lock
    worker_dir: runs/lanes/cpu/workers
    enabled_when: solve.backend == beat_cpu
    rule: If the owner selects beat_cpu, the study runner must explicitly hold runs/.cpu.lane.lock.  The
      current CLI _solve_lock is a null context for CPU because the night runner owns the CPU lock.  gpu-clean
      and night hygiene must not touch hosts of a lane whose lock is live.
runtime_estimates:
  method: Measured S3-style cost ledgers of two local native__ath_core_v4 screen runs, then arithmetic
    extrapolation to the declared 24-call block.  No speedup is claimed.
  source_runs:
  - runs/20261027T070736Z-screen-d37d64
  - runs/20261113T004133Z-screen-46b68c
  block_estimate:
    basis: '18 valid screen BEM calls + 6 verify calls; ~19 attempts to reach 18 valid at the measured
      2-5% refusal rate.  Verify timing is MEASURED on the 5 d37d64 verify solves: 33.2-49.8 s each (1.71-2.56x
      the screen mean 19.43 s).'
    screen_new_bem: 18
    verify_new_bem: 6
    est_screen_seconds:
    - 313.0
    - 335.8
    est_verify_seconds:
    - 199.2
    - 298.8
    est_block_seconds:
    - 512.2
    - 634.6
    est_block_minutes:
    - 8.54
    - 10.58
    est_attempt_cap_seconds: 2426.8
    est_attempt_cap_minutes: 40.45
    est_aggregate_seconds:
    - 25610.0
    - 31730.0
    est_aggregate_hours:
    - 7.11
    - 8.81
    est_aggregate_attempt_cap_hours: 33.71
  caveats:
  - Measured on historical native screen runs (2026-10-27 / 2026-11-13), not on this pilot; host/cache
    state is not controlled.
  - d37d64 wall_span is 29,216 s because of pauses; use its accumulated candidate cost (~3,697 s), not
    wall span.
  - Warm-start arm timing may differ from cold; no warm-start timing was measured.
  - Arithmetic extrapolation only; not a speedup claim.  Real scheduling uses owner availability and a
    required deadline.
  - Verify cost measured on 5 historical native verify solves (2026-10-28, one host state); not on this
    pilot.
  speedup_claimed: false
  measured_evidence:
