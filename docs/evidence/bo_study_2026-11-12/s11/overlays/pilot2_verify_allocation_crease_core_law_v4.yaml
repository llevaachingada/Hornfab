analysis_plan:
  primary_endpoint: Verified top-3 rank agreement and the recorded accept/reject decision under the two
    verification allocations at equal six-call verify cost.
  practical_improvement:
    metric: verified-rank / decision stability
    criterion: Enriched audit changes the verified top-3 set or the accept/reject decision in at least
      20% of complete pairs, or reduces the mean absolute rank shift of the screened top-3 by at least
      one position, with no increase in new BEM calls.
    direction: decision_stability
    label: declared_practical_threshold_not_a_speedup_claim
    rationale: A verification allocation is decision support, not an optimizer.  The criterion asks whether
      the extra audit samples change a decision; it is a declared pilot criterion, not a promise of superiority.
    evidence:
      historical_verified_top3_unchanged_by_verify:
        crease_e7f4f8: true
        native_d37d64: false
      screen_to_verify_j_pairs:
        crease_e7f4f8: *id002
        native_d37d64:
        - - 1.597
          - 2.542
        - - 1.728
          - 2.618
        - - 1.911
          - 3.096
        - - 1.912
          - 2.857
        - - 1.959
          - 2.992
      note: 'Historical 5-finalist verify sets: crease kept its screen top-3 at verify; native did not
        (one swap).  This is the only rank-change evidence; it motivates but does not size the 20% decision-change
        criterion.'
  stopping_rule: 'Predeclared paired analysis by seed index: report the proportion of complete pairs whose
    verified top-3 set or decision changes, the mean absolute rank shift, and a bootstrap 95% CI with
    right-censoring at the six-call verify budget.  Fewer than five complete pairs is pilot_only, not
    a significance guarantee.'
  hypotheses:
  - id: H2
    statement: Enriched audit verification (2 finalists + 4 audit) changes the verified rank/decision
      relative to the current 4+2 allocation on crease__core_law_v4 at equal verify cost.
    label: hypothesis
    falsified_if: No complete pair changes its verified top-3 set or decision, or the change rate is below
      the declared 20% criterion.
    evidence_class: prospective_pilot
  - id: H0
    statement: The two verification allocations agree; the extra audit samples add no decision-relevant
      information at this budget.
    label: hypothesis
    falsified_if: Enriched audit changes the verified top-3 set or decision in at least 20% of complete
      pairs.
    evidence_class: prospective_pilot
  results_parser:
    input: search.ndjson + verify directories
    outcome_classes:
    - valid
    - cached_replay
    - cheap_refusal
    - solver_failure
    - pipeline_failure
    - unknown_failure
    - unknown
    failure_to_objective_mapping: none
    unknown_representation: unknown
    censoring: Right-censored at the declared budget/attempt cap; censored pairs remain in the denominator
      and are never counted as reached.
    verify_calls: Reported separately when mode=verify is recorded; otherwise null with verify_calls_unknown=true.
    note: A solver failure, a cheap pre-BEM refusal and an unclassified row are distinct outcomes.  None
      becomes J=1000 or a silent pass.
rollback_and_adoption:
  fail_or_no_gain_rollback:
  - Preparing or validating this manifest changes no production default, objective version, tolerance/weight,
    cache/dataset behavior, GUI/CLI behavior or registration.
  - If the pilot is not scheduled, discard the scratch overlay; no live file was written.
  - If enriched audit adds no decision-relevant information, keep the current 4-finalist + 2-audit allocation.
  - If enriched audit changes a decision but the change is not supported by measured verified evidence,
    do not adopt it.
  - If the comparison is inconclusive, do not silently enlarge the verify budget; a larger audit is a
    new revision.
  - A cancellation or crash preserves partial results; unknown attempts are reconciled, never relaunched
    automatically.
  owner_adoption_decisions:
  - id: D1
    decision: Adopt enriched 2-finalist + 4-audit verification for this task family
    adopt_if: Prospective paired evidence meets the declared decision-change criterion with no increase
      in new-BEM cost.
    otherwise: Keep the current 4-finalist + 2-audit allocation.
  - id: D2
    decision: Keep the protocol verification policy unchanged
    adopt_if: Enriched audit does not meet the decision-change criterion.
    otherwise: If adopted, prepare a separately reviewed policy revision; do not flip a default.
  - id: D3
    decision: Schedule a larger verification-allocation study
    adopt_if: Pilot variability supports a power plan at the declared criterion.
    otherwise: Stop at the pilot; no budget creep or silent criterion change.
