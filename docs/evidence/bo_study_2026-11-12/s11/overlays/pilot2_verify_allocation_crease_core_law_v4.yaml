  blocked_evidence:
  - item: stop_rules.deadline.deadline_utc
    status: blocked
    reason: owner availability and lane schedule; GPU queue busy until 23:30 local 2026-11-13
  - item: task.pins (execution pin set)
    status: blocked
    reason: the live checkout has moved since the source runs (beat/mesher/hornlab_search SHAs differ
      between source runs); the pin set must be chosen and frozen by the owner when the pilot is scheduled.
  - item: paired-difference SD / power plan
    status: blocked
    reason: no paired crease replicates exist yet; expansion is planned from the pilot pairs
  - item: execution_authorized
    status: blocked
    reason: owner gate; prepare-only manifest
