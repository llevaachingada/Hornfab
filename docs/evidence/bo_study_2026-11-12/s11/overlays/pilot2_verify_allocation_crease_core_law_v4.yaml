schema_version: 1
protocol: bo-study-v1.1
manifest_id: s11-pilot2-verify-allocation-crease-core-law-v4
kind: overlay
mode: prepare_only
execution_authorized: false
question: 'Hypothesis (not a claim): on crease__core_law_v4, an enriched audit verification allocation
  (2 finalists + 4 audit) changes the verified top-3 rank or the accept/reject decision relative to the
  current 4-finalist + 2-audit allocation at the same six verify calls.  No speedup or improvement is
  promised.'
notes: This is a second physical task, not a second copy of pilot 1.  It shares the brief/scoring family
  but has different geometry/bounds and more searched knobs. Results are never pooled with native__ath_core_v4.  The
  overlay is never applied by this tool.
