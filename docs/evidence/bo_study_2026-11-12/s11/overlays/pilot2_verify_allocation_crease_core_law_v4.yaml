  backend: beat_cuda
  role: second_task_verification_allocation
  source_caveat_hz: 3957
  source_caveat: 2-inch uniform-piston f11 is approximately 3957 Hz; above it the 300-8000 Hz result is
    a geometry comparison under that excitation, not real 2-inch driver exit behaviour.
  cohort:
    census: scratch/bo_m0/s0/ath_census/cohorts.json
    offline_scores: scratch/bo_m0/r0/offline_scores_native_full/offline_scores.json
    native_only: true
    pool_across_configs: false
    note: The S0 primary screen group contains native__ath_core_v4, atlas__ath_core, atlas__core_law and
      crease__core_law_v4 at the same grid/dependency/target hash.  The census reports pooled group counts
      (1,499 complete replayable rows), not a config-specific count for crease.
  comparability:
    reference_task: native__ath_core_v4
    relation: Different physical task, same brief family and objective v4; descriptive group membership
      only, never a pooled comparison.
    shared_identity:
    - same brief file native_ath_core_2in_v4.yaml and objective v4 weights/tolerances/cov_narrow_ratio
      2.0
    - 'S0 primary screen group: grid_hash 7bd5a9d5825df12e, dependency_hash e3614d0ba5956ded, target_hash
      add33bc8c5127916'
    caveats:
    - 'Different physical task: crease__core_law_v4 adds the published per-direction a/n/s law (az_* knobs)
      and pins a 399x399 mouth; its results are not pooled with native__ath_core_v4.'
    - The S0 census gives pooled four-config group counts, not config-specific counts; it does not establish
      a config-level independent-experiment count for crease.
    - run_id is missing on all rows of the S0 screen group; independent-experiment identity is insufficient_evidence.  Local
      crease run dirs are used read-only for runtime timing, not as independent proof.
    - Pilot 2 compares two verification allocations on the same second task; it does not compare across
      tasks.
    - Brief-target replay regeneration drift (M2 GATE.md 6) applies to any replayed comparison; pilot
      endpoints use the pilot runs' own runtime verify J.
    pool_across_tasks: false
  pins:
    status: blocked_until_scheduling
    rule: Execution pins are the lib SHAs recorded in each arm run.json at dispatch; both arms of every
      pair must run under one identical pin set, recorded before the first dispatch.  A pin change mid-pilot
      is a new revision.
    checkout_head_at_preparation: 72777950e4f9ec9cde8ae35bd3c65fc492ba6408
    source_run_pins:
    - run: runs/20261027T052720Z-screen-e7f4f8
