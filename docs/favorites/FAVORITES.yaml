          g_sf_n2: 7.0, g_sf_start: 0.25, g_wrap_deg: 81.39}
  strengths: >-
    Best of the five v11 verify finalists on every CD-matrix metric (LW 0.318 dB, DI std 0.462 dB, NACC 0.9954,
    off-axis 0.419 dB); steadiest H beamwidth (67-82 deg over 700 Hz-8 kHz); monotone throat impedance with no resonance.
  weaknesses: >-
    Throat loading: Re z 0.21/0.30/0.38/0.52 at 682/782/896/1028 Hz (LFP20 674 Hz, LFP50 995 Hz) -> v11 load
