# docs/queue/bo_multityp_2026-11-16.yaml and are NOT part of this night.
# Plan: docs/queue/BO_MULTITYPOLOGY_PLAN_2026-11-16.md (arm "cov").
# Admission packet: docs/queue/bo_cov_pilot_2026-11-16.admission.json
#
# Budget 25 screens + 6 verify = 31 calls, 150 attempts (comparison-25). Est. ~1-1.5 h GPU.
night: bo_cov_pilot_2026-11-16
lane: gpu
jobs:
  - {id: preflight, kind: command, timeout_s: 900,
     argv: [.venv/Scripts/python.exe, tools/bo_compare/preflight_arms.py,
            --budget-profile, comparison-25, --min-rows, "100",
