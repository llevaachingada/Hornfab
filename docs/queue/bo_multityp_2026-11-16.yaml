            --task, hl__ext_throat_hvlaw_v7, --policy, scalar, --budget-profile, comparison-25x0,
            --seed, "71004", --deadline-hours, "6", --label, bo_hvlaw_s71004]}
  - {id: bo_hvlaw, kind: command, timeout_s: 14400,
     argv: [C:/Users/hunte/Hrns/oc-wt/bo-study/bayes-venv/Scripts/python.exe, -m, hornlab_search.studies.cli, run,
            --root, runs/bo_multityp_2026-11-16/bo_hvlaw_s71004, --package, package.json,
            --execute, --project-root, C:/Users/hunte/Hrns/hornlab-search]}

