# BoTorch vs CMA-ES, matched comparison on the home task + the strict 80x60 track (prepared 2026-11-14).
# Plan and decision rules: docs/queue/BO_VS_CMA_PLAN_2026-11-15.md.
# PREREQUISITES before launch (all three):
#   1. sab_home_gpu_2026-11-14 has FINISHED (never start a GPU runner while another runs).
#   2. Branch feat/study-budget-profiles (worktree C:\Users\hunte\Hrns\bobudget-wt) is merged into the main
#      checkout: it adds the explicit `comparison-60` study budget profile, `study_cohort --run-id` and
#      tools/bo_compare/prepare_study.py. Without it, the prep_bo_* jobs fail fast (no solves are wasted).
#   3. `run_campaign_night.py --night <this file> --dry-run` passes.
# Shared prior for BOTH methods: run 20261114T043025Z-screen-18985d (185 valid CMA rows, task HOME_SEED5678).
# BO uses it as training data (cohort built with --run-id so the 14 Nov pilot's rows cannot leak in);
# CMA uses it as x0 = that run's best design. Equal new budget: 60 screens + 6 verify calls per arm.
# Estimated ~14 h GPU: BO arm ~2-2.5 h (60 screens + CPU refits + 6 verify), CMA arm ~1 h + its verify,
# 80x60 track ~2.2 h per seed. Pairs are adjacent so a -Cutoff never strands half a pair.
night: bo_vs_cma_2026-11-15
lane: gpu
jobs:
  - {id: prep_cohort, kind: command, timeout_s: 1800,
     argv: [.venv/Scripts/python.exe, -m, tools.analysis.study_cohort,
            --config, examples/typologies/print_80x60_2026-11-13/p80x60__osse_ext_throat_700_v7_seed5678.yaml,
            --dataset, dataset, --out, runs/bo_vs_cma_2026-11-15/cohort,
            --run-id, 20261114T043025Z-screen-18985d]}
  # ---- pair 1 ----
  - {id: prep_bo_s31001, kind: command, timeout_s: 3600,
     argv: [C:/Users/hunte/Hrns/oc-wt/bo-study/bayes-venv/Scripts/python.exe, tools/bo_compare/prepare_study.py,
            --root, runs/bo_vs_cma_2026-11-15/bo_s31001, --cohort, runs/bo_vs_cma_2026-11-15/cohort,
            --seed, "31001", --deadline-hours, "5", --label, bo_s31001]}
