# CD-backbone CMA cohort, 4 x 100 valid screen solves; predeclared in docs/evidence/cd_bo_cohort_2026-11-25/PREDECLARED.md
# 12:45 EST: rolled_beak_* inserted after s1 was watchdog-stopped at the g_depth_h_ratio=1.0 box (kernel allows 1.2).
# 12:55 EST: beak campaigns appended (owner request; addendum in PREDECLARED.md).
night: cd_bo_cohort_2026-11-25
lane: gpu
jobs:
- id: rolled_bb_cohort_s1
  kind: command
  timeout_s: 9000
  env:
    HORNLAB_GPU_LOCK: refuse
  argv:
  - .venv\Scripts\hornlab-search.exe
  - search
  - --config
  - examples/typologies/cd_bo_cohort_2026-11-25/rolled_bb_cohort_s1.yaml
  - --mode
  - screen
  - --dataset-dir
  - dataset
  - --cache-dir
  - runs/cd_bo_cohort_2026-11-25/cache_rolled_bb_cohort_s1
  - --cma-seed
  - '81501'
  - --budget
  - '100'
