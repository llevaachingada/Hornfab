# v11 CD completion night (2026-11-20). Seven partial lanes from the fable_expand append;
# each starts from its own partial-run best design, 50 valid evals, watchdog OFF (the 30%
# refusal / bound-pinned stop was the blocker), one GPU at a time. Bound changes: fold
# az_fold_h_deg hi 10; ext az_a_cos_pow lo 0.5; klangfilm g_beak_v_projection_mm pinned at its
# legal best 0.0411280271 (the proposed -5 widening was rejected: the generator requires >= 0).
# Storm lanes use resample_strict + retry_same_then_stop. biradial_es is already complete
# (50/50) and is NOT rerun. Evidence target: docs/evidence/cd_v11_2026-11-20/.
night: cd_v11_completion_2026-11-20
lane: gpu
watchdog: false
