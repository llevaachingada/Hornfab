# v11 CD verify + x_s2b/x_s2c completion night (2026-11-20, owner request).
# A. Five verify-grid solves of the v11 CD completion bests (29-frequency / 1024-point balloon):
#    ext_throat_hvlaw, osse_fold_warm, osse_morph, ath_core_petal, crowe_x_osse_cd.
# B. Eight watchdog-stopped compact400 expansion lanes from fable_expand_2026-11-19, resumed
#    to their original budgets (x_s2b 80, x_s2c 60) with the watchdog OFF. Same run dirs/CMA state,
#    no rescore of stored rows. One GPU at a time; HORNLAB_GPU_LOCK=refuse.
night: cd_v11_verify_and_expand_2026-11-20
lane: gpu
watchdog: false
jobs:
- id: cd11v__ext_throat_hvlaw
  kind: command
  timeout_s: 1800
  env:
    HORNLAB_GPU_LOCK: refuse
  argv:
  - .venv/Scripts/hornlab-search.exe
  - run
  - --config
  - examples/typologies/cd_v11_verify_2026-11-20/cd11v__ext_throat_hvlaw.yaml
  - --mode
  - verify
