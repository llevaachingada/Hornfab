# compact400 + next-10 night (2026-11-19, Fable senior; STAGED, NOT LAUNCHED - GPU budget is the owner's).
#
# Owner ask 2026-11-19: "make sure everything is ready for 10x next items to add to the queue ...
#   focus on best opportunities for improvement and new horns under a 400 mm cubed bounding box".
#
# A. EIGHT NEW 400 mm-CUBE LANES (identity compact400_xo1000_1400_hf1440_v10xo; never ranked against
#    v7/v10/compact_xo900; floor in docs/research/compact400_2026-11-19/README.md).
#    Why these: a CPU scan of every stored run found 16,270 solved designs inside 400^3, but the ones
#    that hold this corridor at 1 kHz are almost all 2-inch (r0 25.4) ATH core-law horns. At the
#    HF1440 1.4-inch exit only TWO designs in the archive meet it. The 1.4-inch 400-cube horn is the
#    least-explored, most product-relevant cell, so each lane re-throws a current leader family into
#    the cube: size knobs re-bounded, the mouth morph switched on, every other knob inherited.
#    Order = expected value (v10 leaders first, then the compact register, then new-to-size).
#    Every seed: shape_check PASS (fits, round coupling, 1.7-3.5k dofs); search_preflight run with
#    --samples 32 (runs/analysis/compact400_preflight_2026-11-19/).
#
# B. TWO HOME v10 CONTINUATIONS (the open ISSUES item from the Q3 night): the leaders are
#    BOUND-PINNED, not budget-limited, so each widens the pinned knob AND warm-starts at the PUBLISHED
#    best (00826f071b24 / a23763f1c6fc), not the lane seed. v10 home identity unchanged; floor 0.4677.
#
# Generator (re-run to regenerate the configs): scratch/fable_architecture/compact400_2026-11-19/make_configs.py
# Expected GPU: compact lanes ~2-3.5k dofs (~10-20 s/eval) -> ~15-25 min each; home lanes ~4k dofs,
# 80 valid -> ~30-40 min each. Total ~4-5 h; the no-gain watchdog usually ends stalled lanes early.
night: compact400_next10_2026-11-19
lane: gpu
jobs:
  # ---- A. 400 mm cube, HF1440, F_X 1 kHz ----
  - id: c4n__01_fold_warm
    kind: search
    mode: screen
    budget: 60
    timeout_s: 3600
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/compact400_2026-11-19/c4_01_fold_warm__hl__osse_rrect_fold_warm_v7__b6_v10_s1.yaml
  - id: c4n__02_morph
