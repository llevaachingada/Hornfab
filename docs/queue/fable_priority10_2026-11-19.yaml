# PRIORITY10 night (2026-11-19, local orchestrator per the owner's ten-horn GPU-queue handoff).
# NOT launched from the planning session: the W3 night fable_scout40w2_2026-11-19 owns the GPU until its
# tail (s40x3__crowe_x_square_v7, s40x3__rosse_rect_cd_v7) finishes. Launch with queue.ps1 -WaitPid so this
# night starts only after that runner exits - never as a second concurrent GPU runner.
#
# What this is: ten distinct, deduplicated experiments in the handoff's priority order, minus the ones the
# live night already owns. Every id below was checked against runs/ by config_sha AND by physical identity
# (design-mesh-solve hash triple, cache/solve/p2-*); see docs/evidence/PRIORITY10_QUEUE_2026-11-19.md.
#
#   1  #1 Klangfilm-Lame c200 record + V-timing + lip beak   NEW (Fable v2), 1-solve control then 60
#   2  #2 Rolled-rect h12 record + V-timing + lip beak       NEW (Fable v2), 40
#   3  #3 Rolled-rect h12 whole-family hybrid                NEW (Fable v2), 80
#   4  #4 OSSE rrect fold-warm, v10 matched rerun            new; B6 authoring reused verbatim, 120
#   5  #5 Ext-throat H/V-law v7 geometry, v10                new; B6 authoring reused verbatim, 120
#   6  #8 Bi-Radial searched V-terminal width/hold           same config as the 40-valid run, budget 80
#   7  #7 ATH TwinRay380 v8 landscape, v10                   new; B6 authoring reused verbatim, 120
#   8  #6 OSSE rrect morph, v10                              new; B6 authoring reused verbatim, 120
#   9  #9 Klangfilm b3_soft re-homed on v10                  NEW versioned config, seed = its own v10 best, 40
#  10  #10 CROWE v2a four-DOF v10 pilot                      NEW versioned config, 40 (expected cutoff drop)
#
# NOT in this night (and why):
#   * W3 duplicates: fold_warm, morph_v8, tritonia_v8/v9, petal_hvlaw_v7, crowe_x_square, rosse - owned by
#     fable_scout40w2_2026-11-19; a job id that already ran is never re-run.
#   * ATH petal promotion: W3 warm-start closed at 4.16163 (W2 4.1960) = tie, below the v7 floor -> no
#     promotion to a v10 campaign until a verify (complete polars) justifies it.
#   * Tritonia v8 W3 4.8911 is a real +0.48; tritonia v9 W3 5.0032 is worse than v9 W2 4.8785. Neither is
#     promoted on screen rows alone; both need verify before a v10 campaign.
#   * B6 s2 seeds: s1 first, always. They are not in this file; add them only after s1 is read.
night: fable_priority10_2026-11-19
lane: gpu
jobs:
  # ---- 1. Fable v2 control: the record route must replay the c200 parent acoustically (<= 0.05 J) ----
  - id: p10__fv2_kl_record_control
    kind: command
    timeout_s: 1800
    env: {HORNLAB_GPU_LOCK: refuse}
    argv: [.venv/Scripts/hornlab-search.exe, run, --config,
           examples/typologies/fable_v2_2026-11-19/hl__klangfilm_lame_c200_record_control_smooth.yaml,
           --mode, screen]
  # ---- #1 (gate: only trust this lane if the control above reproduces 7.446 within 0.05 J) ----
  - id: p10__fv2_klangfilm_vbeak
    kind: search
    mode: screen
    budget: 60
    timeout_s: 5400
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/fable_v2_2026-11-19/hl__klangfilm_lame_c200_vbeak_v10_v1.yaml
  # ---- #2 rolled record; 20/48 uniform-box samples hit the 6000 dof cap (all mesh_too_large, cheap),
  #      so the refusal-storm stop is relaxed for this job only; max_attempts 400 already covers it ----
  - id: p10__fv2_rolled_record_vbeak
    kind: search
    mode: screen
    budget: 40
    timeout_s: 3600
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/fable_v2_2026-11-19/hl__rolled_rect_record_vbeak_v10_v1.yaml
    watchdog: {refusal_max: 0.55}
  # ---- #3 rolled whole-family hybrid (2/48 sampled refusals) ----
  - id: p10__fv2_rolled_hybrid
    kind: search
    mode: screen
    budget: 80
    timeout_s: 7200
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/fable_v2_2026-11-19/hl__rolled_rect_hybrid_vbeak_v10_v1.yaml
  # ---- #4 B6 s1 (verbatim authored config; v10 brief; 120 VALID evals) ----
  - id: p10__b6_fold_warm_s1
    kind: search
    mode: screen
    budget: 120
    timeout_s: 7200
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/b6_2026-11-19/hl__osse_rrect_fold_warm_v7__b6_v10_s1.yaml
  # ---- #5 B6 s1 ----
  - id: p10__b6_ext_throat_s1
    kind: search
    mode: screen
    budget: 120
    timeout_s: 7200
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/b6_2026-11-19/hl__ext_throat_hvlaw_v7__b6_v10_s1.yaml
  # ---- #8 vt_v1 continuation: 40 valid exist (run 20261119T060516Z-screen-13c866, J 6.3271 v7).
  #      Same config identity, budget 80: the first 40 CMA points replay deterministically and are solve-cache
  #      hits, so this buys 40 NEW evals without re-solving anything. ----
  - id: p10__vt_v1_probe80
    kind: search
    mode: screen
    budget: 80
    timeout_s: 5400
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/studies/u3_biradial_es_style_v7/vt_v1.yaml
  # ---- #7 B6 s1 (twinray) ----
  - id: p10__b6_twinray_s1
    kind: search
    mode: screen
    budget: 120
    timeout_s: 7200
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/b6_2026-11-19/hl__ath_twinray380_landscape_v8__b6_v10_s1.yaml
  # ---- #6 B6 s1 (morph): box sampling 45/48 (3 invalid_geometry) on this box, so no storm gate; the v7
  #      storm was a step-size artefact, not the box. If it storms anyway the watchdog stops it and the
  #      lane is reported, not silently retried. ----
  - id: p10__b6_morph_s1
    kind: search
    mode: screen
    budget: 120
    timeout_s: 7200
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/b6_2026-11-19/hl__osse_rrect_morph_v7__b6_v10_s1.yaml
  # ---- #9 Klangfilm b3_soft on v10, seeded at its own measured v10 best (3.7428).
  #      g_theta_h1_deg is seeded at 59.96 against a KERNEL hard ceiling of 60, so a pin there is expected
  #      and is not a stop reason (same handling as the SCOUT40W requeue). ----
  - id: p10__klangfilm_b3_soft_v10
    kind: search
    mode: screen
    budget: 40
    timeout_s: 3600
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/priority10_2026-11-19/hl__klangfilm_b3_soft_v10__p10_s1.yaml
    watchdog: {pin_ignore: [g_theta_h1_deg]}
  # ---- #10 CROWE v2a on v10: seed J_v10 10.4104, family best J_v10 7.0685 (5.6 J behind the leaders).
  #      Last on purpose; drop it without regret if the cutoff or the tail wins. ----
  - id: p10__crowe_v2a_v10
    kind: search
    mode: screen
    budget: 40
    timeout_s: 3600
    env: {HORNLAB_GPU_LOCK: refuse}
    config: examples/typologies/priority10_2026-11-19/hl__crowe_v2a_c1_v10__p10_s1.yaml
