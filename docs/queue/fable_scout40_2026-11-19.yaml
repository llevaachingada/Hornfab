# SCOUT40 night (cloud Fable senior plan, 2026-11-19; owner: "budget ~40, more typologies, up to 14 h").
# NOT launched from the cloud. Owner box, in order:
#   1) .venv\Scripts\python.exe tools/night_queue/resolve_warm_runs.py examples/typologies/scout40_2026-11-19
#      (fills the 2 @design warm starts, checks every from_runs dir exists; must print OK)
#   2) shape_check + search_preflight on the configs, 3) copy to runs\nights\, dry-run, launch detached, -Cutoff.
# What this night is: a SCOUTING pass, not a ranking. 40 valid evals per lane, warm-started from each lane's own
# best (top 10, sigma from their spread) where history exists, R19 space fixes applied where approved.
# Read it as "which spaces still move": a lane whose best improves by MORE than the floor (v7 0.31 J) in 40 evals
# is promising and goes to the matched B6 rerun; a smaller gain is a tie with noise. v10 ranking = free offline
# rescore afterwards (R1: nights search on v7).
# Two briefs: jobs 1-6 the SMOOTH brief (non-CD constructions, owner: run first); jobs 7-18 home v7 (CD intent) ; J is NOT comparable between the two groups.
# Owner 2026-11-19 (late): 2 FABLE v2 jobs at the top (~2-4 h); Klangfilm c200w and stage_a removed (bad geometry:
# meridian_sanity S-curve / throat pinch / curl back to 9% depth); vt_v1 removed (its biradial host has a throat-blend
# overshoot: H wall 13.5 -> 45.7 -> 36.3 deg in the first 25 mm; fix the generator first). The cutoff drops the tail.
# Order = priority; timeout 1 h per job; the cutoff drops the tail. Estimate [inferred]: 15-45 min per job,
# 18 jobs ~6-12 h. Owner edit 2026-11-19: smooth group first, +2 Klangfilm-Lame versions, morph v7 / twinray v8 removed.
night: fable_scout40_2026-11-19
lane: gpu
jobs:
  # ---- FABLE v2 lanes FIRST (owner 2026-11-19), geometry-checked (tools/analysis/meridian_sanity.py) ----
  # Rationale: docs/research/typologies/FABLE_V2_KLANGFILM_ROLLED_2026-11-19.md (section 6: geometry fixes)
  - {id: fv2__klangfilm_hv_core, kind: search, mode: screen, budget: 60, timeout_s: 5400,
     config: examples/typologies/fable_v2_2026-11-19/hl__klangfilm_hv_core_c200form_v10_v1.yaml}
  - {id: fv2__rolled_clean, kind: search, mode: screen, budget: 80, timeout_s: 7200,
     config: examples/typologies/fable_v2_2026-11-19/hl__rolled_rect_clean_v10_v1.yaml}
  # ---- SMOOTH brief group first (owner); own J scale, not comparable with home v7 ----
  - {id: s40__crowe_v2a_c1, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__crowe_v2a_c1.yaml}
  - {id: s40__lecleach_hv_smooth, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__lecleach_hv_smooth_v7.yaml}
  - {id: s40__iwata_ar_smooth, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__lecleach_iwata_ar_smooth_v7.yaml}
  - {id: s40__klangfilm_b3_soft, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__klangfilm_b3_soft.yaml}
  # ---- home v7 brief (CD intent) ----
  - {id: s40__fold_warm_v7, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__fold_warm_v7.yaml}
  - {id: s40__ext_throat_v7, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__ext_throat_hvlaw_v7.yaml}
  - {id: s40__ext_throat_v8, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__ext_throat_hvlaw_v8.yaml}
  - {id: s40__morph_v8, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__morph_v8.yaml}
  - {id: s40__petal_hvlaw_v7, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__ath_core_petal_hvlaw_v7.yaml}
  - {id: s40__tritonia_v8, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__tritonia_v8.yaml}
  - id: s40__rosse_rect_cd_v7
    kind: command
    timeout_s: 3600
    argv: [.venv/Scripts/python.exe, tools/geometry/rosse_rect_cli.py, search,
           --config, examples/typologies/scout40_2026-11-19/scout40__rosse_rect_cd_v7.yaml, --mode, screen, --budget, "40"]
  - {id: s40__crowe_x_osse_cd_v7, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__crowe_x_osse_cd_v7.yaml}
  - {id: s40__tritonia_v9, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__tritonia_v9.yaml}
  - {id: s40__crowe_x_square_v7, kind: search, mode: screen, budget: 40, timeout_s: 3600,
     config: examples/typologies/scout40_2026-11-19/scout40__crowe_x_square_v7.yaml}
