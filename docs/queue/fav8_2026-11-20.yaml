# FAV-001 8-hour variation night (2026-11-20 evening, owner request). Plan: docs/research/favorites_2026-11-20/FAV8_NIGHT_PLAN.md
# 12 CMA lanes x 80 valid (~35-40 min each at the measured 15-20 s/eval) + verify top 3 of every lane.
# Three brief identities (rank ONLY within each): home 700 Hz v11 (k1_cd_polish, k_low, k_low_s2, sf_shape, wide_h, lip_study, deep),
# home XO900 v11 (x900_*), compact500 XO900 v11 (c500_*). Order interleaves identities so a cutoff still leaves each covered.
night: fav8_2026-11-20
lane: gpu
watchdog: false
jobs:
- id: fav8__k1_cd_polish
  kind: search
  mode: screen
  budget: 80
  timeout_s: 5400
  env:
    HORNLAB_GPU_LOCK: refuse
