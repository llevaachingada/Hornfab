# HOME LANDSCAPE night B (2026-11-15): the three BoTorch modes on the landscape task, right after night A built the cohort.
# Plan: docs/queue/HOME_LANDSCAPE_PLAN_2026-11-15.md. Task hl__ext_throat_hvlaw_v7 (registered in studies/builders.py).
# Cohort = every successful screen row of that exact config (night A's two CMA seeds, ~200 rows).
# Each arm: comparison-60 budget (60 screens + 6 verify). Small meshes (~3.7k dofs) -> ~1 h per arm.
night: home_landscape_b_2026-11-15
lane: gpu
jobs:
  - {id: prep_cohort_hl, kind: command, timeout_s: 1800,
     argv: [.venv/Scripts/python.exe, -m, tools.analysis.study_cohort,
            --config, examples/typologies/home_landscape_2026-11-15/hl__ext_throat_hvlaw_v7.yaml,
            --dataset, dataset, --out, runs/home_landscape_b_2026-11-15/cohort]}
  - {id: prep_hl_scalar_s61001, kind: command, timeout_s: 3600,
     argv: [C:/Users/hunte/Hrns/oc-wt/bo-study/bayes-venv/Scripts/python.exe, tools/bo_compare/prepare_study.py,
            --task, hl__ext_throat_hvlaw_v7, --policy, scalar, --seed, "61001",
            --root, runs/home_landscape_b_2026-11-15/scalar_s61001, --cohort, runs/home_landscape_b_2026-11-15/cohort,
            --deadline-hours, "5", --label, hl_scalar_s61001]}
  - {id: hl_scalar_s61001, kind: command, timeout_s: 21600,
     argv: [C:/Users/hunte/Hrns/oc-wt/bo-study/bayes-venv/Scripts/python.exe, -m, hornlab_search.studies.cli, run,
            --root, runs/home_landscape_b_2026-11-15/scalar_s61001, --package, package.json, --execute,
            --project-root, C:/Users/hunte/Hrns/hornlab-search]}
  - {id: prep_hl_turbo_s62001, kind: command, timeout_s: 3600,
     argv: [C:/Users/hunte/Hrns/oc-wt/bo-study/bayes-venv/Scripts/python.exe, tools/bo_compare/prepare_study.py,
            --task, hl__ext_throat_hvlaw_v7, --policy, turbo, --seed, "62001",
            --root, runs/home_landscape_b_2026-11-15/turbo_s62001, --cohort, runs/home_landscape_b_2026-11-15/cohort,
            --deadline-hours, "5", --label, hl_turbo_s62001]}
  - {id: hl_turbo_s62001, kind: command, timeout_s: 21600,
     argv: [C:/Users/hunte/Hrns/oc-wt/bo-study/bayes-venv/Scripts/python.exe, -m, hornlab_search.studies.cli, run,
            --root, runs/home_landscape_b_2026-11-15/turbo_s62001, --package, package.json, --execute,
            --project-root, C:/Users/hunte/Hrns/hornlab-search]}
  - {id: prep_hl_pareto_s63001, kind: command, timeout_s: 3600,
     argv: [C:/Users/hunte/Hrns/oc-wt/bo-study/bayes-venv/Scripts/python.exe, tools/bo_compare/prepare_study.py,
            --task, hl__ext_throat_hvlaw_v7, --policy, pareto, --seed, "63001",
            --root, runs/home_landscape_b_2026-11-15/pareto_s63001, --cohort, runs/home_landscape_b_2026-11-15/cohort,
            --deadline-hours, "5", --label, hl_pareto_s63001]}
  - {id: hl_pareto_s63001, kind: command, timeout_s: 21600,
     argv: [C:/Users/hunte/Hrns/oc-wt/bo-study/bayes-venv/Scripts/python.exe, -m, hornlab_search.studies.cli, run,
            --root, runs/home_landscape_b_2026-11-15/pareto_s63001, --package, package.json, --execute,
            --project-root, C:/Users/hunte/Hrns/hornlab-search]}
