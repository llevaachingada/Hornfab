# rev2 CPU lane — 2 jobs, E8 CPU/GPU parity fixtures (E0 manifest rev2_ablation_2026-11-13).
#
# CHANGED 2026-11-13 after launch: `kind: search` with `budget: 1` aborts on these fully pinned
# configs (empty CMA x0 -> "TypeError: ufunc 'isinf' ..."). `hornlab-search run` evaluates the
# seed design once, which is what the config headers specify ("budget 1, no CMA").
night: rev2_cpu_parity_2026-11-13
lane: cpu
jobs:
  - {id: cpu_abl_s0_control, kind: command, timeout_s: 7200, argv: [.venv/Scripts/hornlab-search.exe, run, --config, examples/typologies/ablation_2026-11-13/abl_s0_control.yaml, --mode, screen, --backend, beat_cpu, --cache-dir, cache_cpu, --dataset-dir, dataset_cpu]}
  - {id: cpu_abl_m_rate4, kind: command, timeout_s: 7200, argv: [.venv/Scripts/hornlab-search.exe, run, --config, examples/typologies/ablation_2026-11-13/abl_m_rate4.yaml, --mode, screen, --backend, beat_cpu, --cache-dir, cache_cpu, --dataset-dir, dataset_cpu]}
