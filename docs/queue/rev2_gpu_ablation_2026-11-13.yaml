# rev2 GPU lane — 18 jobs, matched ablation + fidelity ladder (E0 manifest rev2_ablation_2026-11-13).
#
# CHANGED 2026-11-13 after launch: every job was `kind: search` with `budget: 1`. These configs
# are fully pinned (all bounds lo==hi with search:false), so the CMA path builds an empty x0 and
# aborts immediately:
#   search ABORTED: TypeError: ufunc 'isinf' not supported for the input types ...
# (observed on the first CPU parity attempt, 2026-11-13T05:27Z). The config headers already say
# "budget 1, no CMA"; `hornlab-search run` is the CLI's "evaluate the seed design once" path, so
# each job is now a command job running `run`. Same one seed solve per job, no optimizer.
night: rev2_gpu_ablation_2026-11-13
lane: gpu
jobs:
  - {id: abl_s0_control, kind: command, timeout_s: 3600, argv: [.venv/Scripts/hornlab-search.exe, run, --config, examples/typologies/ablation_2026-11-13/abl_s0_control.yaml, --mode, screen]}
  - {id: abl_s1_lip12_a3, kind: command, timeout_s: 3600, argv: [.venv/Scripts/hornlab-search.exe, run, --config, examples/typologies/ablation_2026-11-13/abl_s1_lip12_a3.yaml, --mode, screen]}
