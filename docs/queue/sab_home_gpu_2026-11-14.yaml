# SUGGESTION A/B + HOME ATH-LAW queue, GPU lane (2026-11-14). Plan: docs/queue/SAB_HOME_PLAN_2026-11-14.md.
# Tests the 12 Nov report's next-solve suggestions (runs/analysis/day_2026-11-12) and carries them to the home
# 80x60 / 700 Hz brief (room_80x60_700_hf1440_v7) with the ATH CORE-style petal / "ripple" azimuth law.
# Configs: examples/typologies/suggest_ab_2026-11-14/ (all seeds passed tools/shape_check.py on 2026-11-14).
# Estimated ~14.5 h GPU at solver pin 38e5b1f (home ~55-65 s/eval, core_law ~14 s/eval, verify ~7.5x screen).
# Order = priority: a queue.ps1 -Cutoff only drops the tail. Pairs run back to back so a cutoff never
# leaves a treatment without its control.
# H1 seeds share ONE config (seed via --cma-seed) -> one seed-variance group + one >=500-row BO cohort.
night: sab_home_gpu_2026-11-14
lane: gpu
jobs:
  # --- H1: home ext-throat + ATH CORE law, seeds 1-2 (owner priority) ---
  - {id: h1_ext_corelaw_s1234, kind: command, timeout_s: 9000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/p80x60__ext_throat_corelaw_v7.yaml,
            --mode, screen, --budget, "100", --cma-seed, "1234"]}
  - {id: h1_ext_corelaw_s5678, kind: command, timeout_s: 9000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/p80x60__ext_throat_corelaw_v7.yaml,
            --mode, screen, --budget, "100", --cma-seed, "5678"]}
  # --- C1: core_law wide vs narrow box (report items 2, 3, 5), seed pair A ---
  - {id: c1_core_law_wide_s2401, kind: command, timeout_s: 6000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/sab__core_law_wide24k.yaml,
            --mode, screen, --budget, "200", --cma-seed, "2401"]}
  - {id: c1_core_law_narrow_s2401, kind: command, timeout_s: 6000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/sab__core_law_narrow24k.yaml,
            --mode, screen, --budget, "200", --cma-seed, "2401"]}
  # --- H2: home ATH-core 1.4in + ATH CORE law, seed 1 ---
  - {id: h2_athcore_corelaw_s1234, kind: command, timeout_s: 9000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/p80x60__ath_core14_corelaw_v7.yaml,
            --mode, screen, --budget, "100", --cma-seed, "1234"]}
  # --- H1 seed 3 ---
  - {id: h1_ext_corelaw_s9012, kind: command, timeout_s: 9000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/p80x60__ext_throat_corelaw_v7.yaml,
            --mode, screen, --budget, "100", --cma-seed, "9012"]}
  # --- C1 seed pair B ---
  - {id: c1_core_law_wide_s2402, kind: command, timeout_s: 6000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/sab__core_law_wide24k.yaml,
            --mode, screen, --budget, "200", --cma-seed, "2402"]}
  - {id: c1_core_law_narrow_s2402, kind: command, timeout_s: 6000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/sab__core_law_narrow24k.yaml,
            --mode, screen, --budget, "200", --cma-seed, "2402"]}
  # --- report item 7: verify top-5 of every C1 run, pick on verify J ---
  - {id: v_c1_top5, kind: command, timeout_s: 5400,
     argv: [.venv/Scripts/python.exe, tools/night_queue/verify_night_jobs.py, --night, sab_home_gpu_2026-11-14, --top, "5",
            --jobs, "c1_core_law_wide_s2401,c1_core_law_narrow_s2401,c1_core_law_wide_s2402,c1_core_law_narrow_s2402"]}
  # --- H1 seeds 4-5 (completes the five-seed repeatability group, report item 11) ---
  - {id: h1_ext_corelaw_s3456, kind: command, timeout_s: 9000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/p80x60__ext_throat_corelaw_v7.yaml,
            --mode, screen, --budget, "100", --cma-seed, "3456"]}
  - {id: h1_ext_corelaw_s7890, kind: command, timeout_s: 9000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/p80x60__ext_throat_corelaw_v7.yaml,
            --mode, screen, --budget, "100", --cma-seed, "7890"]}
  # --- H2 seed 2 ---
  - {id: h2_athcore_corelaw_s5678, kind: command, timeout_s: 9000,
     argv: [.venv/Scripts/hornlab-search.exe, search, --config, examples/typologies/suggest_ab_2026-11-14/p80x60__ath_core14_corelaw_v7.yaml,
            --mode, screen, --budget, "100", --cma-seed, "5678"]}
  # --- verify the home winners (top 2 per H1 seed, top 3 per H2 seed) ---
  - {id: v_home_top, kind: command, timeout_s: 10800,
     argv: [.venv/Scripts/python.exe, tools/night_queue/verify_night_jobs.py, --night, sab_home_gpu_2026-11-14, --top, "2",
            --top-for, h2_athcore_corelaw_s1234=3, --top-for, h2_athcore_corelaw_s5678=3,
            --jobs, "h1_ext_corelaw_s1234,h1_ext_corelaw_s5678,h1_ext_corelaw_s9012,h1_ext_corelaw_s3456,h1_ext_corelaw_s7890,h2_athcore_corelaw_s1234,h2_athcore_corelaw_s5678"]}
