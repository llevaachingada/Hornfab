# Combined speed campaign, block 2 of 2 - NEW PIN 9ec86b0 (A3: skip the unused fused identity cache).
# Run only after installing the pin:
#   pip install --force-reinstall --no-deps "hornlab-beat-bem @ git+https://github.com/llevaachingada/hornlab-beat-bem.git@9ec86b0c22d65573240a36199210ada517b67928"
#   python -m hornlab_beat_bem.provision --backend cpu
# Same four arms as block 1, so the pin effect, the batch effect and their interaction are all readable, and
# combo_new_b1_* vs combo_old_b1_* is the fused-path output parity check the Oracle asked for.
night: speed_combo_2026-11-14_newpin
lane: gpu
jobs:
  - {id: combo_new_b1_osse,  kind: search, budget: 1, mode: screen, timeout_s: 3600,
     config: examples/typologies/print_80x60_2026-11-13/p80x60__osse_ext_throat_700_v7.yaml,
     env: {HORNLAB_FREQ_BATCH_SIZE: "1"}}
  - {id: combo_new_b12_osse, kind: search, budget: 1, mode: screen, timeout_s: 3600,
     config: examples/typologies/print_80x60_2026-11-13/p80x60__osse_ext_throat_700_v7.yaml,
     env: {HORNLAB_FREQ_BATCH_SIZE: "12"}}
  - {id: combo_new_b1_ath,   kind: search, budget: 1, mode: screen, timeout_s: 3600,
     config: examples/typologies/print_80x60_2026-11-13/p80x60__ath_core_14in_700_v7.yaml,
     env: {HORNLAB_FREQ_BATCH_SIZE: "1"}}
  - {id: combo_new_b12_ath,  kind: search, budget: 1, mode: screen, timeout_s: 3600,
     config: examples/typologies/print_80x60_2026-11-13/p80x60__ath_core_14in_700_v7.yaml,
     env: {HORNLAB_FREQ_BATCH_SIZE: "12"}}
