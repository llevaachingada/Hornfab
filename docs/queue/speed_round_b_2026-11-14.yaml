# Speed program, ROUND B - new solver (both upgrade parts, one fork SHA). Design: docs/queue/SPEED_PROGRAM_2026-11-13.md
# Run only after installing the new SHA from the GitHub URL and re-provisioning the CPU backend:
#   pip install --force-reinstall --no-deps "hornlab-beat-bem @ git+https://github.com/llevaachingada/hornlab-beat-bem.git@<new-sha>"
#   python -m hornlab_beat_bem.provision --backend cpu
# Four arms: {batch 1, batch 12} x {D1 osse_ext_throat, D2 ath_core}, --budget 1.
# new-b1 vs Round A's base-b1 = the upgrade effect AND the fused-path parity check (bar 0.039 dB / 1 deg).
# new-b12 vs new-b1 = the batching effect and the batch x upgrade interaction.
night: speed_round_b_2026-11-14
lane: gpu
jobs:
  - {id: new_b1_osse,  kind: search, budget: 1, mode: screen, timeout_s: 3600,
     config: examples/typologies/print_80x60_2026-11-13/p80x60__osse_ext_throat_700_v7.yaml,
     env: {HORNLAB_FREQ_BATCH_SIZE: "1"}}
  - {id: new_b12_osse, kind: search, budget: 1, mode: screen, timeout_s: 3600,
     config: examples/typologies/print_80x60_2026-11-13/p80x60__osse_ext_throat_700_v7.yaml,
     env: {HORNLAB_FREQ_BATCH_SIZE: "12"}}
  - {id: new_b1_ath,   kind: search, budget: 1, mode: screen, timeout_s: 3600,
     config: examples/typologies/print_80x60_2026-11-13/p80x60__ath_core_14in_700_v7.yaml,
     env: {HORNLAB_FREQ_BATCH_SIZE: "1"}}
  - {id: new_b12_ath,  kind: search, budget: 1, mode: screen, timeout_s: 3600,
     config: examples/typologies/print_80x60_2026-11-13/p80x60__ath_core_14in_700_v7.yaml,
     env: {HORNLAB_FREQ_BATCH_SIZE: "12"}}
