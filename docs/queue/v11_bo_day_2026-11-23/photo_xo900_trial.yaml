night: photo_xo900_v11_trial_2026-11-23
lane: gpu
pause: true
jobs:
- id: photo900_lame_v4_81301
  kind: command
  timeout_s: 7200
  env:
    HORNLAB_GPU_LOCK: refuse
  watchdog:
    pin_ignore:
    - g_aspect
    - g_end_frac
    - g_fc_hz
    - g_lame_p
    - g_rim_sweep_ratio
    no_gain_valid: 100
    stall_valid: 100
  argv:
  - .venv/Scripts/hornlab-search.exe
  - search
  - --config
  - examples/typologies/photo_xo900_v11_2026-11-23/lame_v4.yaml
  - --mode
  - screen
  - --dataset-dir
  - dataset
  - --cache-dir
  - runs/photo_xo900_v11_cache/lame_v4
  - --cma-seed
  - '81301'
  - --budget
  - '30'
