# Horn + woofer readiness registry — read by the GUI (#/hw/*), never edited by it.
#
# `cases` DECLARES what the run files cannot say about themselves: the fidelity label (the BL
# result reader refuses to guess it — bl_results.to_system_response), which motor/transducer
# shape a case used, and which gate it answers. Status facts (staged/validated/solved/refused,
# box dims, horn offset, clearance) are always read from the case dirs, never from here.
# Source for every entry: SENIOR_REVIEW_HANDOFF_2026-11-19.md §3/§4 + FIRST_REFERENCE_CASE.json.
#
# Schema v2 (2026-11-20, senior review §3.1): case declarations live in cases.d/*.yaml so a tool
# can propose an entry without hand-editing this file.  Each entry carries
# `status: proposed | approved`, `proposed_by` and (when approved) `approved_by`; a duplicate key
# across files is reported by the loader, never resolved last-wins.  A missing key is UNDECLARED.
schema: hw_readiness_v2
updated: 2026-11-21
handoff: docs/research/system_woofer_2026-11-18/SENIOR_REVIEW_HANDOFF_2026-11-19.md
case_files:
  - cases.d/*.yaml

fidelity_note: >-
  Coupled cases are declared COUPLED_VENTED_FEM_BEM_LEM with the FIRST_REFERENCE_CASE fidelity
  policy attached: the horn channel is an ideal normal-velocity source (no compression-driver
  absolute SPL), and every case uses BL's provider-default transducer SHAPE.

