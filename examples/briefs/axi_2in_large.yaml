# Baseline brief: large 2-inch-throat rollback horn, 90 x 40 degrees, K-law-consistent (Phase D).
# Envelope follows the maker-anchored large-horn class (TwinRay 380 380x303x192; the
# iwata-style large horns 590x450x320; AudioHorn X40 408x248x230 with 23 mm depth):
# (lowercase references: the catalog's neutrality rule reserves the uppercase tokens)
# The K-law (d = KEELE_K/(f0*coverage)): at f0 = 1000 Hz the required mouths are
# 282 (W, 90 deg) x 635 (H, 40 deg) mm - W fits the 640 envelope; the H axis is envelope-flagged infeasible at
# 1000 Hz and the brief's feasibility record states the honest held coverage instead
# (W: 25400e3/(1000*640) = 39.7 deg held at 90 target... the config's f0 carries it;
# campaigns read raw["feasibility"]).
name: axi_2in_large
description: Large 2-inch rollback 90x40, 640x460x340 envelope, f0 1000 Hz (baseline Phase D)
driver:
  exit_radius_mm: 25.4          # 2-inch driver
  exit_angle_deg: 4.0           # slow-expansion throat class
envelope:
  max_mouth_w_mm: 640.0
  max_mouth_h_mm: 460.0
  max_depth_mm: 340.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 40.0
  band_lo_hz: 500.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0
  z_min: 0.7
  f0_hz: 1000.0                 # S1a opt-in: the K-law design frequency (derivation + mask)
objective:
  version: 3                    # v3: freq-weighted cov + the below-f0 mask
weights:
  cov: 1
  rip: 1
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.5
verify_only: false