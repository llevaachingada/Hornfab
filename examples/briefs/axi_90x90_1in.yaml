# Brief: axisymmetric 90x90 degrees, 1-inch compression driver
# Fair to classical horns (TYPOLOGY_PLAN.md s3): coverage_h == coverage_v => axisymmetric families allowed.
# load weight 0.5 and z_min 0.7 because loading matters for classical horns (TYPOLOGY_PLAN.md s3).
name: axi_90x90_1in
description: Axisymmetric 90x90 degree horn, 1-inch driver, 360x360x220 mm envelope
driver:
  exit_radius_mm: 12.7          # 1-inch throat radius
  exit_angle_deg: 5.0           # throat wall angle at z=0
envelope:
  max_mouth_w_mm: 360.0         # symmetric H/V; 360 mm square mouth for 90 deg coverage
  max_mouth_h_mm: 360.0
  max_depth_mm: 220.0
symmetry: axisymmetric          # H == V; both axisymmetric and hv families are eligible
source:
  cap: auto                     # r_source = r0 / sin(theta_throat)
target:
  coverage_h_deg: 90.0          # TOTAL included angle, -6 dB; same in H and V => axisymmetric
  coverage_v_deg: 90.0
  band_lo_hz: 700.0
  band_hi_hz: 5500.0            # limited by 8 GB RTX 4060 dof cap (TOOLCHAIN.md)
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.7                    # loading threshold: tractrix/Le Cleac'h should exceed 0.7 above f_load
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.5                     # loading is explicitly weighted for classical-horn comparison
