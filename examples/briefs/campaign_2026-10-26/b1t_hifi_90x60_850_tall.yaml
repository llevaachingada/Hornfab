# Brief b1t - hi-fi 90 x 60 deg, f0 850 Hz, 1.4-inch driver, TALL (strict K-law both axes).
#
# PURPOSE: campaign cell family b1t (docs/SOLVE_CAMPAIGN_PLAN_2026-10-26.md s3). Strict K-law
#   coverage brief: the mouth is PORTRAIT because the wider coverage angle needs the SMALLER
#   mouth on that axis. This is the honest K-law geometry, not swapped labels.
# K-LAW ARITHMETIC (mouth = 25,400,000 / (f0 * coverage_deg)):
#   H axis: 25,400,000 / (850 * 90) = 332.0 mm
#   V axis: 25,400,000 / (850 * 60) = 498.0 mm
#   Envelope 360 x 520 x 400 mm holds the K-law mouth plus the freestanding shell.
# DRIVER CLASS: 1.4-inch compression driver (35-36 mm exit class), r0 = 18.0 mm,
#   exit half-angle 2.5 deg. One campaign-wide r0 pick per plan s3 (18.0 mm, B&C/BMS class).
# f11 DISCLOSURE: 1.4in f11 5,653 Hz: 5.7-8 kHz compares geometry, not the driver.
name: b1t_hifi_90x60_850_tall
description: Hi-fi 90x60, f0 850 Hz, 1.4-inch, strict K-law portrait mouth (332x498), 360x520x400 envelope, band 300-8000 Hz
driver:
  exit_radius_mm: 18.0
  exit_angle_deg: 2.5
envelope:
  max_mouth_w_mm: 360.0
  max_mouth_h_mm: 520.0
  max_depth_mm: 400.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 60.0
  band_lo_hz: 300.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 850.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.0
grid:
  verify_points_per_octave: 6
objective:
  version: 3
