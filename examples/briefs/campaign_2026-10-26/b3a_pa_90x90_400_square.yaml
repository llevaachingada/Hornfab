# Brief b3a - PA 90 x 90 deg, f0 400 Hz, 1.4-inch 300 Hz-class driver, SQUARE.
#
# PURPOSE: fallback low-reach campaign brief b3a (docs/SOLVE_CAMPAIGN_PLAN_2026-10-26.md s3 B3a).
#   Strict K-law on both (equal) axes; loading is not scored here (the plan's load term belongs
#   to B3b), so z_min stays 0.
# K-LAW ARITHMETIC (mouth = 25,400,000 / (f0 * coverage_deg)):
#   H axis: 25,400,000 / (400 * 90) = 705.6 mm
#   V axis: 25,400,000 / (400 * 90) = 705.6 mm
#   Envelope 740 x 740 x 650 mm holds the K-law mouth plus the freestanding shell.
# DRIVER CLASS: 1.4-inch 300 Hz-class compression driver (BMS 4594ND class), r0 = 18.0 mm,
#   exit half-angle 2.0 deg.
# f11 DISCLOSURE: 1.4in f11 5,653 Hz: 5.7-8 kHz compares geometry, not the driver.
name: b3a_pa_90x90_400_square
description: PA 90x90, f0 400 Hz, 1.4-inch 300 Hz class, K-law square mouth (706x706), 740x740x650 envelope, band 300-8000 Hz
driver:
  exit_radius_mm: 18.0
  exit_angle_deg: 2.0
envelope:
  max_mouth_w_mm: 740.0
  max_mouth_h_mm: 740.0
  max_depth_mm: 650.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 90.0
  band_lo_hz: 300.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 400.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.0
grid:
  verify_points_per_octave: 6
objective:
  version: 3
