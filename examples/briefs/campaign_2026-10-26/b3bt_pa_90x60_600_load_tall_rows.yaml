# Brief b3bt_rows - PA 90 x 60 deg, f0 600 Hz, 1.4-inch 300 Hz-class driver, TALL, ROWS variant.
#
# PURPOSE: campaign cell family b3bt for the non-CD rows families (Le Cleac'h / Salmon).
#   Identical geometry/envelope/driver/loading to b3bt_pa_90x60_600_load_tall, with
#   weights.dislope 0.
# ROWS/OBJECTIVE NOTE: a non-CD profile cannot hold a flat DI slope, so dislope is zeroed for
#   every Le Cleac'h/Salmon cell (LANE_A s3.6, LANE_B s7). A rows cell and a morph cell on the
#   "same" brief are NOT ranked together: the objective weights differ.
# K-LAW ARITHMETIC (mouth = 25,400,000 / (f0 * coverage_deg)):
#   H axis: 25,400,000 / (600 * 90) = 470.4 mm
#   V axis: 25,400,000 / (600 * 60) = 705.6 mm
#   Envelope 500 x 740 x 600 mm.
# DRIVER CLASS: 1.4-inch 300 Hz-class compression driver, r0 = 18.0 mm, exit half-angle 2.0 deg.
# LOADING: weights.load 0.5, z_min 0.7 (verify-tier evidence).
# f11 DISCLOSURE: 1.4in f11 5,653 Hz: 5.7-8 kHz compares geometry, not the driver.
name: b3bt_pa_90x60_600_load_tall_rows
description: PA 90x60 f0 600 Hz loading, 1.4-inch 300 Hz class, portrait K-law mouth, 500x740x600 envelope, ROWS objective (dislope 0)
driver:
  exit_radius_mm: 18.0
  exit_angle_deg: 2.0
envelope:
  max_mouth_w_mm: 500.0
  max_mouth_h_mm: 740.0
  max_depth_mm: 600.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 60.0
  band_lo_hz: 300.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.7
  f0_hz: 600.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.0
  flat: 0.5
  load: 0.5
grid:
  verify_points_per_octave: 6
objective:
  version: 3
