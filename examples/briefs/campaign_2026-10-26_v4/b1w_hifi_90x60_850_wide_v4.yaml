# OBJECTIVE v4 COPY (2026-10-27, generated by tools/make_v4_campaign.py): the v3 brief with
# tolerance-normalised scoring. The v3 brief is untouched.
# CLASS A (constant-directivity waveguide): narrow side counts 2x the wide side; DI std and the
# diagonal term are live; the 2.5-5.5 kHz presence band is weighted x2 (owner field experience).
# Tolerances: docs/evidence/OBJECTIVE_V4_TOLERANCES.md (class A = Option A); class B/C numbers are
# proposals [E] from docs/research/V4_TOLERANCE_RESEARCH_2026-10-27.md. Raw term = stored term x tolerance.
# Brief b1w - hi-fi 90 x 60 deg, f0 850 Hz, 1.4-inch driver, WIDE (commercial convention).
#
# PURPOSE: wide-envelope branch of b1t (docs/SOLVE_CAMPAIGN_PLAN_2026-10-26.md s3 D-11 option b).
#   The H axis keeps the strict K-law mouth; the V axis is allowed to narrow to the 380x300
#   envelope, i.e. V coverage is honest only above the frequency the envelope can hold.
# K-LAW ARITHMETIC (mouth = 25,400,000 / (f0 * coverage_deg)):
#   H axis: 25,400,000 / (850 * 90)  = 332.0 mm
#   V-K-law would be 25,400,000 / (850 * 60) = 498.0 mm, which needs a 520 mm tall envelope.
#   This branch instead sets target.f0_v_hz = 25,400,000 / (60 * 300) = 1411 Hz: the 300 mm
#   envelope height holds 60 deg from 1411 Hz. Objective v3 masks the V-plane coverage error
#   below f0_v_hz; the H plane is still scored from f0 850 Hz.
# DRIVER CLASS: 1.4-inch compression driver (35-36 mm exit class), r0 = 18.0 mm,
#   exit half-angle 2.5 deg.
# f11 DISCLOSURE: 1.4in f11 5,653 Hz: 5.7-8 kHz compares geometry, not the driver.
name: b1w_hifi_90x60_850_wide_v4
description: (objective v4) Hi-fi 90x60, f0 850 Hz (V from 1411 Hz), 1.4-inch, wide 380x300x400 envelope, band 300-8000 Hz
driver:
  exit_radius_mm: 18.0
  exit_angle_deg: 2.5
envelope:
  max_mouth_w_mm: 380.0
  max_mouth_h_mm: 300.0
  max_depth_mm: 400.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 60.0
  band_lo_hz: 300.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 850.0
  f0_v_hz: 1411.0
  freq_weights:
    band_hz:
      - [2500.0, 5500.0, 2.0]
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.0
  distd: 0.5
  diag: 0.5
grid:
  verify_points_per_octave: 6
objective:
  version: 4
  tolerances:
    cov: 2.0
    rip: 1.0
    di: 0.4
    dislope: 9.0
    flat: 1.5
    load: 0.3
    distd: 2.0
    diag: 2.0
  cov_narrow_ratio: 2.0
