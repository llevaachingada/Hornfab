# tolerance-normalised scoring. The v3 brief is untouched.
# CLASS A (constant-directivity waveguide): narrow side counts 2x the wide side; DI std and the
# diagonal term are live; the 2.5-5.5 kHz presence band is weighted x2 (owner field experience).
# Tolerances: docs/evidence/OBJECTIVE_V4_TOLERANCES.md (class A = Option A); class B/C numbers are
# proposals [E] from docs/research/V4_TOLERANCE_RESEARCH_2026-10-27.md. Raw term = stored term x tolerance.
# Brief b2t - PA 60 x 40 deg, f0 1200 Hz, 1.4-inch driver, TALL (strict K-law both axes).
#
# PURPOSE: campaign cell family b2t (docs/SOLVE_CAMPAIGN_PLAN_2026-10-26.md s3 B2-prime).
#   The 60x40 pattern at 1200 Hz matches real 60x40 PA horns; the mouth is portrait under the
#   strict K-law (the wider 60 deg axis needs the smaller dimension).
# K-LAW ARITHMETIC (mouth = 25,400,000 / (f0 * coverage_deg)):
#   H axis: 25,400,000 / (1200 * 60) = 352.8 mm
#   V axis: 25,400,000 / (1200 * 40) = 529.2 mm
#   Envelope 380 x 560 x 300 mm holds the K-law mouth plus the freestanding shell.
# DRIVER CLASS: 1.4-inch compression driver (35-36 mm exit class), r0 = 18.0 mm,
#   exit half-angle 2.5 deg. One campaign-wide r0 pick per plan s3.
# f11 DISCLOSURE: 1.4in f11 5,653 Hz: 5.7-8 kHz compares geometry, not the driver.
