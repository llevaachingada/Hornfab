# OBJECTIVE v4 COPY (2026-10-27, generated by tools/make_v4_campaign.py): the v3 brief with
# tolerance-normalised scoring. The v3 brief is untouched.
# CLASS C (low-reach PA that falls off): below f0 a WIDE pattern is physics and free, a NARROW one is
# still scored (one_sided); narrow side 2x everywhere; presence band weighted x2.
# Tolerances: docs/evidence/OBJECTIVE_V4_TOLERANCES.md (class A = Option A); class B/C numbers are
# proposals [E] from docs/research/V4_TOLERANCE_RESEARCH_2026-10-27.md. Raw term = stored term x tolerance.
# Brief b3a_rows - PA 90 x 90 deg, f0 400 Hz, 1.4-inch 300 Hz-class driver, SQUARE, ROWS variant.
#
# PURPOSE: campaign cell family b3a for the non-CD rows families (Le Cleac'h / Salmon).
#   Identical geometry/envelope/driver to b3a_pa_90x90_400_square, with weights.dislope 0.
# ROWS/OBJECTIVE NOTE: a non-CD profile cannot hold a flat DI slope, so dislope is zeroed for
#   every Le Cleac'h/Salmon cell (LANE_A s3.6, LANE_B s7). A rows cell and a morph cell on the
#   "same" brief are NOT ranked together: the objective weights differ.
# K-LAW ARITHMETIC (mouth = 25,400,000 / (f0 * coverage_deg)):
#   H axis: 25,400,000 / (400 * 90) = 705.6 mm
#   V axis: 25,400,000 / (400 * 90) = 705.6 mm
#   Envelope 740 x 740 x 650 mm.
# DRIVER CLASS: 1.4-inch 300 Hz-class compression driver, r0 = 18.0 mm, exit half-angle 2.0 deg.
# f11 DISCLOSURE: 1.4in f11 5,653 Hz: 5.7-8 kHz compares geometry, not the driver.
name: b3a_pa_90x90_400_square_rows_v4
description: (objective v4) PA 90x90, f0 400 Hz, 1.4-inch 300 Hz class, K-law square mouth, 740x740x650 envelope, ROWS objective (dislope 0)
driver:
  exit_radius_mm: 18.0
  exit_angle_deg: 2.0
envelope:
  max_mouth_w_mm: 740.0
  max_mouth_h_mm: 740.0
  max_depth_mm: 650.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 90.0
  band_lo_hz: 300.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 400.0
  freq_weights:
    band_hz:
      - [2500.0, 5500.0, 2.0]
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.0
  flat: 0.5
  load: 0.0
  distd: 0.3
  diag: 0.5
grid:
  verify_points_per_octave: 6
objective:
  version: 4
  tolerances:
    cov: 4.5
    rip: 2.0
    di: 0.4
    dislope: 36.0
    flat: 1.5
    load: 0.3
    distd: 3.0
    diag: 4.5
  cov_narrow_ratio: 2.0
  cov_below_f0: one_sided
