# v11 CD MATRIX brief (2026-11-20, owner-directed: docs/research/cd_metrics_2026-11-20/V11_CD_MATRIX.md).
# objective v11 CD matrix (Sridhar et al. 2019) + off-axis smoothness; loud-home 110 dB max; CD-only identity;
# never rankable against v7/v9/v10.
# Copied verbatim from home_landscape_2026-11-18_v10/room_landscape_80x50_700_hf1440_v10.yaml: every v10 key and
# value (envelope 600x480x480, HF1440, F_X 700 Hz, corridor H 60-90 / V 40-60, tolerances,
# ripple_region: preferred_edge) is unchanged except the top-level weights reduced per V11_CD_MATRIX.md
# section 1 (rip 0.5, flat 0.5, flat_cv 0.5, dislope 0.5, di_roughness 0.5; cov_profile/load stay 1.0;
# the CD weights live only in objective.cd); version -> 11 and the objective.cd block is added
# (spec section 2 of V11_CD_MATRIX.md). New identity: J is never ranked against v7/v9/v10.
# grid: copied from room_landscape_80x50_700_hf1440_v7 (18 screen / 29 verify frequencies: the grid the
#   N3 frequency floor was measured on).
# USE: CD-identity searches only (docs/queue/cd_v11_2026-11-20.yaml). NOT a default; do not rescore stored runs.
name: room_landscape_80x50_700_hf1440_v11cd
description: '(objective v11) CD MATRIX: corridor H 60-90 (pref 80) from 700 Hz, V 40-60 (pref
  50) from 1000 Hz, ripple_region preferred_edge, loading on, plus the v11 CD block (M2 listening
  window 1.5 dB, M4 DI std 1.0 dB, M5 NACC 0.02, band-mean off-axis smoothness 2.5-8 kHz); HF1440,
  600x480x480; band 350-8000 Hz. CD-only identity, loud-home 110 dB max; never rankable against
  v7/v9/v10.'
driver:
  exit_angle_deg: 2.0
  exit_radius_mm: 18.0
envelope:
  max_depth_mm: 480.0
  max_mouth_h_mm: 480.0
  max_mouth_w_mm: 600.0
symmetry: hv
source:
  cap: auto
target:
  band_hi_hz: 8000.0
  band_lo_hz: 350.0
  coverage_h_deg: 80.0
  coverage_profile:
    h:
    - hz: 700
      max_deg: 90
      min_deg: 60
      preferred_deg: 80
    - hz: 8000
      max_deg: 90
      min_deg: 60
      preferred_deg: 80
    interpolation: log_frequency
    mode: corridor
    v:
    - hz: 1000
      max_deg: 60
      min_deg: 40
      preferred_deg: 50
    - hz: 8000
      max_deg: 60
      min_deg: 40
      preferred_deg: 50
  coverage_v_deg: 50.0
  coverage_v_down_deg: null
  coverage_v_up_deg: null
  di_slope_target: 0.0
  di_target_db: null
  driver_exit_radius_mm: null
  f0_hz: 700.0
  f0_v_hz: 700.0
  freq_weights:
    band_hz:
    - - 2500.0
      - 5500.0
      - 2.0
  loaded_hi_hz: 5600.0
  z_min: 0.5
weights:
  cov_profile: 1.0
  di_roughness: 0.5
  dislope: 0.5
  flat: 0.5
  flat_cv: 0.5
  load: 1.0
  rip: 0.5
grid:
  verify_points_per_octave: 6
  screen_extra_hz:
  - 250
  - 315
  - 400
  - 2573
  - 3311
  - 4260
objective:
  cov_below_f0: one_sided
  cov_narrow_ratio: 2.0
  cov_v_weight: 0.5
  flat_band: scored
  lfp_crossover_ratio: 1.6
  lfp_re_z: 0.2
  loaded_re_z: 0.5
  tolerances:
    cov_profile: 3.0
    di_roughness: 1.0
    dislope: 9.0
    flat: 1.5
    flat_cv: 1.5
    load: 0.3
    rip: 1.0
  version: 11
  ripple_region: preferred_edge
  cd:
    band_hz: [700.0, 8000.0]
    window_h_deg: 30.0
    window_v_deg: 10.0
    lw:
      weight: 1.5
      tolerance_db: 1.5
    di_std:
      weight: 0.75
      tolerance_db: 1.0
    nacc:
      weight: 0.75
      tolerance: 0.02
    offaxis:
      weight: 1.0
      tolerance_db: 1.0
      reference: band_mean
      band_hz: [2500.0, 8000.0]
      angles_h_deg: [-40, -30, 30, 40]
      angles_v_deg: [-25, -10, 10, 25]
    report:
      omega: true
      contour: false
