description: '(objective v11) CD MATRIX: corridor H 60-90 (pref 80) from 700 Hz, V
  40-60 (pref 50) from 1000 Hz, ripple_region preferred_edge, loading on, plus the
  v11 CD block (M2 listening window 1.5 dB, M4 DI std 1.0 dB, M5 NACC 0.02, band-mean
  off-axis smoothness 2.5-8 kHz); HF1440, 600x480x480; band 350-8000 Hz. CD-only identity,
  loud-home 110 dB max; never rankable against v7/v9/v10. | OPEN ENVELOPE (owner decision
  2026-11-22): the build box is not a search refusal; only a 1200 mm per-dimension
  sanity ceiling applies. Filter by size post hoc if a build constraint returns.'
