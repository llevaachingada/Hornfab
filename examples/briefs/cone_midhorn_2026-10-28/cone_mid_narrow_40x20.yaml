# Cone mid-horn brief (2026-10-28). driver.exit_radius_mm is informational only (the schema needs one
# < 100 mm); tools/cad/plughorn.py owns the cone. Envelope = the CAD part + 10 % room to tweak.
name: cone_mid_narrow_40x20
description: 'Evo 7SH-class cone mid horn (10-inch): 40 x 20 nominal (Funktion-One
  spec sheet: 10-inch 220 Hz-4 kHz, 112 dB at 1 W); band 250-3000 Hz (dof budget)'
driver:
  exit_radius_mm: 76.0
  exit_angle_deg: 0.0
envelope:
  max_mouth_w_mm: 670.0
  max_mouth_h_mm: 470.0
  max_depth_mm: 650.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 40.0
  coverage_v_deg: 20.0
  band_lo_hz: 250.0
  band_hi_hz: 3000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.0
