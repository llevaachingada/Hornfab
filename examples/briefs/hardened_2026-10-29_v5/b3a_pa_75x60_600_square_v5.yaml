# OBJECTIVE v5 COPY (2026-10-29, hardened plan): the 400 Hz v4 b3a brief and the 480 Hz 90x90 brief
# are untouched; this is the NEW 600 Hz 75x60 b3a cell. It exists because the b3a ext-throat family
# naturally lands near 64 deg at 8 kHz: 64/75 = 0.85 passes the H +/-20% gate and 64/60 = 1.07 passes
# the V -40/+25% gate. At 480 Hz the same family still failed loading (LFP20 330 > 300); at 600 Hz
# the loading target is 375 Hz, so the same seed passes. The 90x90/480 brief was over-constrained.
# CLASS C (low-reach PA that falls off): below f0 a WIDE pattern is physics and free, a NARROW one is
# still scored (one_sided); narrow side 2x everywhere; presence band weighted x2.
# Tolerances: v4 class C numbers plus flat_cv 1.5 (objective v5).
# Brief b3a - PA 75 x 60 deg, f0 600 Hz, 1.4-inch 300 Hz-class driver, SQUARE 740 x 740.
#
# PURPOSE: low-reach PA with a realistic 1.4-inch driver. The 75x60 target accepts the family's
# natural 64-deg top-octave pattern (a ~1 dB edge narrowing, not a 2x beaming problem) and moves
# f0 to 600 Hz so the loading gate is reachable with the extended throat.
# K-LAW ARITHMETIC (mouth = 25,400,000 / (f0 * coverage_deg)):
#   H axis: 25,400,000 / (600 * 75) = 564.4 mm
#   V axis: 25,400,000 / (600 * 60) = 705.6 mm
#   Envelope 740 x 740 x 650 mm holds both; the b3a 588x588 seed also fits.
# DRIVER CLASS: 1.4-inch 300 Hz-class compression driver (BMS 4594ND class), r0 = 18.0 mm,
#   exit half-angle 2.0 deg.
# LOADING (v5): load weight 1.0; the v5 LFP20 / Re z / flat_cv terms are scored.
# f11 DISCLOSURE: 1.4in f11 5,653 Hz: 5.7-8 kHz compares geometry, not the driver.
name: b3a_pa_75x60_600_square_v5
description: (objective v5) PA 75x60, f0 600 Hz, 1.4-inch 300 Hz class, K-law mouth 564x706, 740x740x650 envelope, band 300-8000 Hz, v5 LFP loading + flat_cv
driver:
  exit_radius_mm: 18.0
  exit_angle_deg: 2.0
envelope:
  max_mouth_w_mm: 740.0
  max_mouth_h_mm: 740.0
  max_depth_mm: 650.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 75.0
  coverage_v_deg: 60.0
  band_lo_hz: 300.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 600.0
  freq_weights:
    band_hz:
      - [2500.0, 5500.0, 2.0]
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 1.0
  distd: 0.5
  diag: 0.5
  flat_cv: 0.5
grid:
  verify_points_per_octave: 6
  screen_extra_hz: [250, 315, 400, 2573, 3311, 4260]
objective:
  version: 5
  tolerances:
    cov: 4.5
    rip: 2.0
    di: 0.4
    dislope: 36.0
    flat: 1.5
    load: 0.3
    distd: 3.0
    diag: 4.5
    flat_cv: 1.5
  cov_narrow_ratio: 2.0
  cov_below_f0: one_sided
  loaded_re_z: 0.5
  lfp_re_z: 0.2
  lfp_crossover_ratio: 1.6
  bw8k_floor: 0.75
