# Brief: Le Cleac'h, 90 x 90 (axisymmetric), f0 1200 Hz, 1-inch driver, analysis band 500-10000 Hz.
# Rewritten 2026-10-26 (band top 8k -> 10k) after the measured failure of the earlier pairing.
#
# WHY (the fault this fixes): the previous pass ran lecleach_rollback against a 90 deg target from
# 700 Hz to 5.5 kHz. Measured beamwidth of the best design was
#   180/139.5/121.6/108.8/97.4/88.7/84.0/83.3/76.3/66.0/58.6/54.4 deg at 500..5500 Hz
# i.e. 90 deg only near 1.5 kHz, ~55-60 deg at the top. A Le Cleac'h is a spherical-wave LOADING
# profile: it narrows with frequency and is NOT constant-directivity. The impossible target made
# `dislope` dominate (56.6 of J 43.9) and pinned g_T and g_fc_hz at their bounds.
#
# THIS BRIEF:
#   - f0 = 1200 Hz: K-law mouth at 90 deg = 25,400,000/(1200*90) = 235 mm (fits 360 mm envelope).
#   - band 500-10000 Hz (owner-directed); v3 masks cov/dislope below f0, so 500-1200 Hz still
#     scores ripple/flat/loading - this family's real strengths.
#   - dislope weight 0: a non-CD family cannot hold a flat DI slope; scoring it is a trap.
#   - DOF CLASS at the 10 kHz top: quarter dofs ~ 3000*(235/400)^2*(10000/5500)^2 = ~3,400 ->
#     SCREEN-FEASIBLE (under the 5,000 cap). This is the only one of the three 500-10000 briefs
#     that can actually be solved at 10 kHz on the 8 GB card.
#   - f11 = 100,250/12.7 = 7,894 Hz: the top 2.1 kHz of the band is above the driver's first
#     cross mode, so 7.9-10 kHz compares geometry, not driver behaviour. Disclosed, not hidden.

name: lecleach_90x90_1200hz_1in
description: Le Cleac'h 90x90 axisymmetric, f0 1200 Hz, 1-inch, 400x400x260 mm envelope, analysis band 500-10000 Hz
driver:
  exit_radius_mm: 12.7
  exit_angle_deg: 4.0          # JMLC convention: HALF-angle (8 deg included -> 4)
envelope:
  max_mouth_w_mm: 400.0
  max_mouth_h_mm: 400.0
  max_depth_mm: 260.0
symmetry: axisymmetric
source:
  cap: auto
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 90.0
  band_lo_hz: 500.0
  band_hi_hz: 10000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 1200.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.0
  flat: 0.5
  load: 0.0
objective:
  version: 3
