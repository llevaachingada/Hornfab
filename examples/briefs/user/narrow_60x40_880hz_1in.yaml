# Brief: NARROW dispersion 60 x 40 H/V, f0 880 Hz, 1-inch driver, analysis band 500-10000 Hz.
# Rewritten 2026-10-26 (band top 8k -> 10k per owner).
#
# K-LAW SIZING:  H: 25,400,000/(880*60) = 481.1 mm     V: 25,400,000/(880*40) = 721.6 mm
#
# *** TWO CONSTRAINTS THE PREVIOUS PASS VIOLATED ***
#  1. MOUTH ANGLE. A 40 deg V pattern needs a mouth WALL half-angle of ~20 deg. The
#     freeform_sculpt config bounds mouthAngleDeg to 35..70 deg, i.e. >= 70 deg patterns, so the
#     40 deg target was unreachable by construction. A run of this brief needs mouthAngleDeg
#     bounds near 15..40 (H) and 12..35 (V).
#  2. DOF CLASS AT 10 kHz: NOT SOLVABLE ON THE 8 GB CARD. Quarter dofs ~
#     3000*(d/400)^2*(f/5500)^2 -> at d = 722 mm and 10 kHz that is ~32,000 dofs against a 5,000
#     screen cap / 8,900 hard ceiling. The largest mouth that meshes at 10 kHz is 284 mm
#     (screen) or 379 mm (hard). A 60x40 horn reaching 880 Hz therefore cannot be analyzed to
#     10 kHz: legal candidates all shrink and lose the 880 Hz control.
#     For 10 kHz feasibility at 60x40 the f0 must rise to ~2100 Hz (d_v = 302 mm).
#
# f11 = 100,250/12.7 = 7,894 Hz -> 7.9-10 kHz is above the driver's first cross mode.

name: narrow_60x40_880hz_1in
description: Narrow waveguide 60x40 H/V, f0 880 Hz, 1-inch, 540x780x400 mm envelope, analysis band 500-10000 Hz (10 kHz infeasible on 8 GB)
driver:
  exit_radius_mm: 12.7
  exit_angle_deg: 5.0
envelope:
  max_mouth_w_mm: 540.0
  max_mouth_h_mm: 780.0
  max_depth_mm: 400.0
symmetry: hv
source:
  cap: auto
target:
  coverage_h_deg: 60.0
  coverage_v_deg: 40.0
  band_lo_hz: 500.0
  band_hi_hz: 10000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 880.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.0
objective:
  version: 3
