# GUI-only typology entries (not a campaign catalog).
#
# ``examples/catalog.yaml`` is the stock CLI's family allowlist: every entry there must be
# materializable by the normal seed gate. The 2026-11-15 home-landscape bridge cells use
# process-local custom rows types (rosse_rect, rolled_rect_pucker, crowe_panel) that only load
# after their own CLI installs the bridge:
#   tools/geometry/rosse_rect_cli.py
#   tools/geometry/rolled_rect_cli.py
#   tools/geometry/crowe_panel_cli.py
# Putting them in examples/catalog.yaml would make ``--families all`` route them to a stock
# search that cannot load them. This supplement is read by the GUI typology view only, so the
# cells stay visible there without altering search. The GUI sandbox previews them through
# ``tools/geometry/gui_preview.py`` (a fresh process with exactly one bridge installed); the
# seed gate still marks them launch-disabled because the stock campaign path cannot load them.
#
# Fields match examples/catalog.yaml. Do not add these names to examples/catalog.yaml.
entries:
  - name: hl__rosse_rect_cd_v7
    gui_only: true
    config: typologies/home_landscape_2026-11-15/hl__rosse_rect_cd_v7.yaml
    group: home
    symmetry: hv
    description: HOME rolled rectangular mouth on ATH R-OSSE per azimuth; bridge cell; GUI preview works, run via tools/geometry/rosse_rect_cli.py

  - name: hl__rolled_es_spiral_v7
    gui_only: true
    config: typologies/home_landscape_2026-11-15/hl__rolled_es_spiral_v7.yaml
    group: home
    symmetry: hv
    description: HOME Crowe ES-style exponential-spiral rolled rectangle (narrowing, non-CD by design); bridge cell; GUI preview works, run via rolled_rect_cli.py

  - name: hl__crowe_panel_home_v7
    gui_only: true
    config: typologies/home_landscape_2026-11-15/hl__crowe_panel_home_v7.yaml
    group: home
    symmetry: hv
    description: HOME Crowe ES-600 digitized-section family scaled to the home envelope; bridge cell; GUI preview works, run via crowe_panel_cli.py

  - name: rf__rect_radial_wide_v7
    gui_only: true
    config: typologies/rolled_family_2026-11-15/rf__rect_radial_wide_v7.yaml
    group: home
    symmetry: hv
    description: "Spiral radial-relief experiment (soft inner waist/diagonal ridge). This is NOT the section-pucker rim fold in strong_a.png and NOT the square-X reference photo; use sp__strong_v7 for the strong_a mouth pucker and hl__crowe_x_square_v7 for the square X. Seed 12/16 mm; starts 6/8, 12/16, 16/22; window 0.50/0.80/0.96; shape-only."

  - name: hl__crowe_x_square_v7
    gui_only: true
    config: typologies/home_landscape_2026-11-15/hl__crowe_x_square_v7.yaml
    group: home
    symmetry: hv
    description: "Near-square Crowe-X-inspired probe: four concave panels, diagonal ridge, 479x479 mouth. Searches the acoustic levers: a_h/a_v (coverage), L (loading), s/n (termination), lip/wrap (mouth termination) and sf_amt (X strength); the visual X constants sf_n1/sf_n2/sf_ab/sf_start are fixed. Pilot best sf_amt 0.42-0.47, below the 0.60 visual seed. A square mouth will not hold 50 deg vertical at 700 Hz; 25-eval pilot, 8-12 envelope refusals."

  - name: rf__section_axial_home_v7
    gui_only: true
    config: typologies/rolled_family_2026-11-15/rf__section_axial_home_v7.yaml
    group: home
    symmetry: hv
    description: "OPTIMIZATION CELL: home-scaled section family. Searches width 480-600, height 220-420, depth 170-300, H/V depth split 0.9-1.1, crown 10-40, junction 16-48, and axial H/V pucker 0-12/0-14. Width/height set coverage and pattern control; depth sets loading/flare; H/V depth split sets top/bottom vs side termination; crown/junction set section curvature; the axial pucker is a secondary mouth-rim/diagonal phase lever, not a coverage law. Seed = best home-panel design + 7/9 pucker."

  - name: rf__section_axial_strong_v7
    gui_only: true
    config: typologies/rolled_family_2026-11-15/rf__section_axial_strong_v7.yaml
    group: home
    symmetry: hv
    description: "VISUAL REFERENCE ONLY: exact strong_a.png rim-pucker look, fixed 417x203 ES-600 mouth, axial 7/9. Same geometry as legacy sp__strong_v7 (max point diff 9.6e-7). Its fixed mouth/depth/crown box is not an acoustic optimization cell; use rf__section_axial_home_v7 for that."
