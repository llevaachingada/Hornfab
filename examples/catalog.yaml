# Typology catalog for hornlab-search campaign (TYPOLOGY_PLAN.md s7, LANE B).
# Each entry names a config under examples/ plus its group, symmetry and a one-line description.
# Groups:
#   magnus   - Magnus mesher native families (OSSE, R-OSSE, ICW, FREEFORM); no generator code needed
#   legacy   - utility configs not intended for typology comparison (smoke tests, adapters)
#   classical - generator-based classical horns: conical, exponential, hypex, tractrix, OSSE
#               meridian; biradial (US4308932A) + quadratic-throat (the QTW white-paper rule)
#               (2026-10-25 correction: Le Cleac'h is LIVE per the owner directive - the R9-J
#               gate passed at 0.00 mm; the old "gated off" note here was stale)
#   hybrid   - generator-based hybrids: H/V, blend, perturbed, splice (C1-corrected)
#   organic  - WP9b per-azimuth rollback rows (LABELED HYPOTHESIS-SHAPE EXPERIMENTS, neutral names;
#              dossier docs/research/typologies/WP9_WP9B_GROUNDING_2026-10-25.md section 2.4)
#              + the 2026-10-25 owner-approved additions: signed-X v2, the even-lobe mouth
#              ripple (the "pleats"), and the asymmetric Le Cleac'h (odd-cosine, full ring).
#              hv symmetry: every azimuth has its own fc(phi), so these are NOT axisymmetric.
# The orchestrator will append classical and hybrid entries; keep this format simple.
#
# Fields:
#   name:        unique identifier for --families SPEC and in leaderboard output
#   config:      path relative to examples/  (the config must load with load_config)
#   group:       one of magnus | legacy | classical | hybrid | organic
#   symmetry:    hv | axisymmetric | full   (must match the config's mesh.quadrants and the
#              design's symmetry; "full" = the 2026-10-25 seam-free full-ring rows models,
#              quadrants '1234', e.g. the odd-cosine lecleach_asym)
#   description: one-line human description

entries:
  - name: osse_baseline
    config: osse_baseline.yaml
    group: magnus
    symmetry: hv
    # WP2 (senior pass 2026-10-24): this entry is tied to its own 1.4-inch driver (r0 17.78 mm,
    # brief osse_75x45.yaml); campaigns under a 1-inch brief SKIP it with the reason printed.
    driver_exit_mm: 17.78
    brief_tied: osse_75x45.yaml
    description: OSSE baseline 75x45 deg, 1.4-inch driver, 10 searchable knobs (CP-8c reference)

  - name: rosse_baseline
    config: rosse_baseline.yaml
    group: magnus
    symmetry: hv
    description: R-OSSE baseline 90x60 deg, 1-inch driver, rollback mouth; loading term active

  - name: icw_termination
    config: icw_termination.yaml
    group: magnus
    symmetry: axisymmetric   # ICW is phi-independent (same curve all azimuths)
    description: ICW flat-baffle termination, 100x100 deg, 1-inch driver; 6 searchable knobs

  - name: icw_rollback
    config: icw_rollback.yaml
    group: magnus
    symmetry: axisymmetric   # ICW is phi-independent
    description: ICW rollback (icw_seed from R-OSSE, tmax=1.0 natural rollback), 1-inch driver; 5 searchable knobs

  - name: freeform_sculpt
    config: freeform_sculpt.yaml
    group: magnus
    symmetry: hv
    description: FREEFORM sculpted waveguide 90x90 deg, 11 searchable control-point knobs

  - name: freeform_hv
    config: freeform_hv.yaml
    group: magnus
    symmetry: hv
    description: FREEFORM H/V waveguide 75x45 deg, 3 searchable knobs (mouth angles + exponent)

  - name: throat_adapter
    config: throat_adapter.yaml
    group: legacy
    symmetry: hv
    description: OSSE throat adapter (extension length/angle/slot search); not for typology comparison

  - name: search_smoke
    config: search_smoke.yaml
    group: legacy
    symmetry: hv
    description: Small smoke-test copy of osse_baseline with clipped budget; not for typology comparison

  # ---- typology generators (docs/TYPOLOGY_PLAN.md s4; config under examples/typologies/) ----
  - name: conical
    config: typologies/conical.yaml
    group: classical
    symmetry: axisymmetric
    description: conical horn r = r0 + z tan(alpha), fixed depth and mouth radius (2 knobs)

  - name: exponential
    config: typologies/exponential.yaml
    group: classical
    symmetry: axisymmetric
    description: exponential horn r = r0 exp(m z), f_c = m c / 2 pi (2 knobs)

  - name: hypex
    config: typologies/hypex.yaml
    group: classical
    symmetry: axisymmetric
    description: hyperbolic-exponential (Salmon) horn, T in [0, 1] (3 knobs)

  - name: tractrix
    config: typologies/tractrix.yaml
    group: classical
    symmetry: axisymmetric
    description: Voigt tractrix, mouth radius c / 2 pi f_c, cut at an 80 deg wall (1 knob)

  - name: osse_axi
    config: typologies/osse_axi.yaml
    group: classical
    symmetry: axisymmetric
    description: Magnus's OSSE meridian sampled from his formula, axisymmetric FREEFORM (4 knobs)

  - name: hyb_osse_h_hypex_v
    config: typologies/hyb_osse_h_hypex_v.yaml
    group: hybrid
    symmetry: hv
    description: H/V hybrid, OSSE horizontal (coverage control) x hypex vertical (loading)

  - name: hyb_osse_h_tractrix_v
    config: typologies/hyb_osse_h_tractrix_v.yaml
    group: hybrid
    symmetry: hv
    description: H/V hybrid, OSSE horizontal x tractrix vertical, 75 deg wall cap

  - name: blend_osse_tractrix
    config: typologies/blend_osse_tractrix.yaml
    group: hybrid
    symmetry: axisymmetric
    description: convex blend (1-w) OSSE + w tractrix, axisymmetric

  - name: blend_conical_exponential
    config: typologies/blend_conical_exponential.yaml
    group: hybrid
    symmetry: axisymmetric
    description: convex blend of conical and exponential at the same size, axisymmetric

  - name: perturbed_osse_hv
    config: typologies/perturbed_osse_hv.yaml
    group: hybrid
    symmetry: hv
    description: OSSE H and V (separate coverage) + monotone increment perturbation, rounded-rectangle mouth (18 knobs)

  - name: perturbed_tractrix
    config: typologies/perturbed_tractrix.yaml
    group: hybrid
    symmetry: axisymmetric
    description: tractrix + monotone increment perturbation (8 knobs)

  # ---- WP9 (senior pass 2026-10-24; dossier docs/research/typologies/WP9_WP9B_GROUNDING_2026-10-25.md) ----
  - name: splice_osse_tractrix
    config: typologies/splice_osse_tractrix.yaml
    group: hybrid
    symmetry: axisymmetric   # one meridian mirrored all azimuths (profile_v: same)
    description: C1 splice OSSE throat -> tractrix mouth, zs_frac searched in [0.2, 0.8] (1 knob)

  - name: throatblend_hypex
    config: typologies/throatblend_hypex.yaml
    group: classical
    symmetry: axisymmetric   # one meridian mirrored all azimuths (profile_v: same)
    description: hypex with an OS throat blend over [0, throat_blend_mm], 0-30 mm (4 knobs)

  - name: spherical_salmon
    config: typologies/spherical_salmon.yaml
    group: classical
    symmetry: axisymmetric   # one meridian mirrored all azimuths (profile_v: same)
    description: spherical-wavefront Salmon march (neutral G4 name), fc/T/stop searched (3 knobs)

  # ---- WP10 (senior pass 2026-10-24 WP10; point-grid adapter) ----
  - name: grid_ellipse
    config: typologies/grid_ellipse.yaml
    group: classical
    symmetry: axisymmetric   # quarter-symmetric point grid with an axisymmetric (V=H) surface
    description: point-grid adapter, plain ellipse section (pnorm 2, zero modulation), 2 knobs

  - name: grid_ellipse_mod
    config: typologies/grid_ellipse_mod.yaml
    group: classical
    symmetry: hv   # G8/G9 modulated section (a1 0.06 cos 2phi) is NOT phi-independent -> hv
    description: point-grid adapter, G8/G9 modulated mouth (a1 0.06, a2 -0.03, 2 mm side rollback), 2 knobs

  # ---- WP9b (dossier section 2.4 / plan 9b.2 T3/T5; owner ruling 2026-10-25) ----
  # LABELED HYPOTHESIS-SHAPE EXPERIMENTS under neutral names. The per-azimuth Salmon rows are
  # NOT an attributed published construction (R9); the verified JMLC construction ships separately
  # as lecleach_f90 / lecleach_rollback (see the Le Cleac'h block below).
  # symmetry: hv because H and V march with different fc (fc_h != fc_v): the quarter model is
  # mirror-symmetric about the cardinal planes, but the surface is NOT phi-independent, so it
  # is not 'axisymmetric' for campaign compatibility purposes.
  - name: salmon_elliptical
    config: typologies/salmon_elliptical.yaml
    group: organic
    symmetry: hv
    description: per-azimuth spherical_salmon rows (fc_h 800 / fc_v 1100 seed), rollback stop; 4 knobs; labeled hypothesis

  - name: salmon_x_shape
    config: typologies/salmon_x_shape.yaml
    group: organic
    symmetry: hv
    description: the same rows + T5 diagonal term x_amp 0.25 / x_fc 0.15 (6 knobs); labeled hypothesis

  # ---- Le Cleac'h (JMLC): LIVE per the owner directive 2026-10-25 ----
  # Verified Fourcade 2015 construction (eqs 10-27, 42-43); the R9-J gate PASSED (mouth width
  # 467.30 mm, 0.00 mm gap) against the published fig. 7 reference case:
  # docs/research/typologies/JMLC_LECLEACH_RESEARCH_2026-10-25.md
  #   * lecleach_f90: FREEFORM meridian, stop <= 88 deg (z monotone); axisymmetric because
  #     profile_v is mirrored from one meridian.
  #   * lecleach_rollback: GRID rows route (real rollback, stop 90-240 deg). The rows are the
  #     SAME axisymmetric march on every azimuth, so symmetry stays axisymmetric: compatible
  #     with a 90x90 (coverage_h == coverage_v) brief; is_compatible SKIPs it under an hv
  #     90x60 brief, which is correct because the surface has no H/V split.
  # examples/typologies/lecleach.yaml (the old gated stub) is REMOVED: it was superseded by
  # lecleach_f90.yaml and unlisted; the gated stub is gone rather than left inconsistent.
  - name: lecleach_f90
    config: typologies/lecleach_f90.yaml
    group: classical
    symmetry: axisymmetric   # one meridian mirrored all azimuths (profile_v: same)
    description: Le Cleac'h (Fourcade 2015) exact meridian, stop <= 88 deg, fc/T/stop searched (3 knobs)

  - name: lecleach_rollback
    config: typologies/lecleach_rollback.yaml
    group: organic
    symmetry: axisymmetric   # same axisymmetric march on every azimuth (no H/V split)
    description: Le Cleac'h exact rollback via the GRID rows route, stop 120-240 searched (3 knobs)

  # ---- JMLC-family variants (lib-2, docs/research/typologies/JMLC_FAMILY_VARIANTS_RESEARCH_2026-10-25.md) ----
  # Every entry below is a LABELED RECONSTRUCTION/HYPOTHESIS over the VERIFIED Fourcade
  # meridian: no published per-azimuth JMLC math, no published AR construction, no published
  # torus-lip math exists (lib-2 C1/C2 and section 5). Neutral names only.
  #   * salmon_saddle: the NEUTRAL Salmon rows with an explicit span: half and fixed
  #     [inferred] a2/b1 stop fractions ([0.25] / [0.2], not searchable). The sin(phi) term
  #     is left-right symmetric but up/down antisymmetric -> HALF model (quadrants "14");
  #     the mouth is not phi-independent => symmetry hv. The 90x60 organic brief fits.
  #   * lecleach_iwata_ar: the area-preserving AR stretch (H != V) over the verified
  #     meridian; both mirror planes still hold, so it is a QUARTER model (quadrants "1")
  #     and the catalog symmetry is hv (not axisymmetric).
  #   * lecleach_toroidal: the tangent-continuous lip is the same on every azimuth =>
  #     axisymmetric; compatible with the 90x90 axi brief, SKIPPED (correctly) under the
  #     90x60 organic brief.
  - name: salmon_saddle
    config: typologies/salmon_saddle.yaml
    group: organic
    symmetry: hv
    description: Salmon rows + explicit HALF span and a fixed C2 a2/b1 stop saddle (top != bottom), labeled hypothesis; 4 knobs

  - name: lecleach_iwata_ar
    config: typologies/lecleach_iwata_ar.yaml
    group: organic
    symmetry: hv
    description: Le Cleac'h exact meridian + area-preserving AR evolution (AR_m/AR_p, T=0.5 pinned), our reconstruction; 4 knobs

  - name: lecleach_toroidal
    config: typologies/lecleach_toroidal.yaml
    group: organic
    symmetry: axisymmetric   # same tangent lip on every azimuth (no H/V split)
    description: Le Cleac'h exact rollback + tangent-continuous toroidal lip (r_lip 6-35 mm), inferred; 4 knobs

  # ---- S1a typology completion (2026-10-25, owner-directed; the C4 batch) ----
  # The five expansion configs, previously uncatalogued (R9_AUDIT_2026-10-25 P3: this
  # commit closes the catalog-prose gap - biradial + QTW were advertised under
  # `classical` since 2026-10-25 with no entries). NO driver_exit_mm ties: every one of
  # these typologies marches under 1in / 1.4in / 2in drivers (S1a driver pass, measured
  # 2026-10-25); the driver class is chosen by the BRIEF (hifi_90x60_{1in,14in,2in} /
  # organic_rollback_{1in,14in,2in} / lecleach_rollback_{1in,14in,2in}), never by the
  # catalog entry.
  - name: biradial_keele
    config: typologies/biradial_keele.yaml
    group: classical
    symmetry: hv
    description: Keele/JBL Bi-Radial power-series walls (US4308932A), per-plane a/n/rm searched (7 knobs)

  - name: qtw_waveguide
    config: typologies/qtw_waveguide.yaml
    group: classical
    symmetry: hv
    description: Hughes/Peavey quadratic-throat arc rule, a = coverage/2 per plane, rm derived (5 knobs)

  - name: lecleach_asym_odd
    config: typologies/lecleach_asym_odd.yaml
    group: organic
    symmetry: full              # seam-free full ring: the odd-cosine term breaks the LR mirror (C2)
    description: Le Cleac'h (Fourcade 2015) march + odd-cosine one-sided asymmetry, full ring (5 knobs); labeled reconstruction

  - name: salmon_x_signed
    config: typologies/salmon_x_signed.yaml
    group: organic
    symmetry: hv
    description: salmon rows + SIGNED x_amp (cardinal-in vs corner-out readings), quarter model (6 knobs); labeled hypothesis

  - name: salmon_ripple12
    config: typologies/salmon_ripple12.yaml
    group: organic
    symmetry: hv
    description: salmon rows + even-lobe mouth ripple (12 lobes, half model) - the pleats experiment (7 knobs); labeled experiment

  # ---- ATH-derived framework entries (2026-10-25, owner-directed) ----
  # ath_core is the published CORE recipe reduced to constant azimuth and wired to the
  # native Ath Morph law; ath_twinray_380 is a published-dimension reconstruction with the
  # same native morph. Both labels are carried verbatim in the config headers.
  - name: ath_core
    config: typologies/ath_core.yaml
    group: classical
    symmetry: hv              # square morph breaks axisymmetry; H and V targets match
    description: generalized ATH CORE 2-inch OS-SE + native mouth morph; target/exponent/width/height/corner/rate/fixed searched

  - name: ath_twinray_380
    config: typologies/ath_twinray_380.yaml
    group: classical
    symmetry: hv
    description: TwinRay 380 1.4-inch published-dimension reconstruction + searchable superellipse mouth; full shape/outline search
