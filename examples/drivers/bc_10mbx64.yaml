# STAND-IN driver for the cone_plughorn mid (10-inch slot, Evo 7SH topology).
# Not a Funktion-One driver: F1 publishes no T/S for its mid units. Every number below is printed on
# the manufacturer's own product page (source URL); nothing is derived or guessed.
#
# The datasheet prints Mms only (moving mass INCLUDING the driver's own air load), so the model flags
# this file `(Mms! air-load split missing)`: the front air load is supplied by the BEM horn load, so the
# absolute excursion and the low-frequency level are optimistic. Use it for relative horn-vs-horn work
# and for an order-of-magnitude sensitivity check, not as a prediction of the built box.
#
# The sealed rear bowl is a property of the HORN, not of the driver: this file carries no rear_box_l.
# Pass the measured net bowl volume with `tools/loudness_report.py --rear-box-l <L>`.

kind: cone
name: B&C 10MBX64 (stand-in, Mms only)
source: https://www.bcspeakers.com/en/products/lf-driver/10/8/10mbx64
use: pa
notes: >-
  Stand-in for the Evo 7SH 10-inch mid. B&C publishes this model as a product page only (no PDF
  datasheet). Cone: "Waterproof Impregnated Cone" (weatherproof impregnated paper), radial shape.
  No frequency range and no recommended crossover are published on the page; do not invent them.

exit_diameter_mm: null

nominal_impedance_ohm: 8
re_ohm: 5.5
le_mh: 0.39                  # printed as Le, with no measurement frequency

sd_cm2: 346
mms_g: 32                    # printed as Mms (includes air load); Mmd NOT published -> flagged
bl_tm: 16.9
fs_hz: 65
qms: 5.6
qes: 0.27
qts: 0.26

power_aes_w: 350             # printed "Nominal Power Handling"; continuous program 700 W
xmax_mm: 4.0                 # printed Xmax; Xvar 5.5

published_sensitivity_db: 100.0
published_sensitivity_condition: >-
  "Applied RMS Voltage is set to 2.83 V for 8 ohms Nominal Impedance" (manufacturer tooltip) -
  i.e. 1 W into 8 ohm nominal.
