# Score identities: which (brief, objective version) pairs form ONE rankable score, and its tie floor.
#
# Read by the GUI Overview (hornlab_search/gui/data_overview.py). J is only ever ranked inside one
# identity: never across briefs, objective versions or target variants. `floor_j` is the published
# score-consistency floor for that identity (two designs closer than it are a tie); null = not yet
# published, so the Overview shows no tie band. Every number here is copied from the cited source;
# update the source first, then this file.
#
# status:
#   current     - in active use; shown on the Overview by default
#   diagnostic  - pilot / probe identity; shown, labelled diagnostic
#   legacy      - superseded; hidden unless "show legacy" is on
# A (brief, version) pair NOT listed here is "unregistered" when version >= 7, "legacy" below that.
schema: score_identities_v1
updated: 2026-11-20
defaults:
  min_valid_for_leader: 10      # runs with fewer valid evaluations are probes, not leaderboard rows
  legacy_below_version: 7
