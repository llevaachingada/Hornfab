name: throat_adapter
family: OSSE

seed_params:
  r0_mm:   17.78        # 1.4 in exit radius
  a_deg:   37.5         # coverage HALF-angle in the mesher's convention
  a0_deg:  15.5
  L_mm:    260.0
  n:       4.0
  s:       0.7
  q:       0.995
  k:       1.0
  exponent: 2.0         # circular: axisymmetric adapter
  aspect_ratio: 1.0
  throat_ext_length_mm: 10.0
  throat_ext_angle_deg: 5.0
  slot_length_mm: 0.0

bounds:
  throat_ext_length_mm: {lo: 0.0,  hi: 40.0}
  throat_ext_angle_deg: {lo: 0.0,  hi: 15.0}
  slot_length_mm:       {lo: 0.0,  hi: 30.0}
  a0_deg:               {lo: 2.0,  hi: 30.0}
  k:                    {lo: 0.3,  hi: 2.5}
  r0_mm:        {lo: 17.78, hi: 17.78, search: false}
  a_deg:        {lo: 37.5,  hi: 37.5,  search: false}
  L_mm:         {lo: 260.0, hi: 260.0, search: false}
  n:            {lo: 4.0,   hi: 4.0,   search: false}
  s:            {lo: 0.7,   hi: 0.7,   search: false}
  q:            {lo: 0.995, hi: 0.995, search: false}
  exponent:     {lo: 2.0,   hi: 2.0,   search: false}
  aspect_ratio: {lo: 1.0,   hi: 1.0,   search: false}

target:
  coverage_h_deg: 75.0        # TOTAL included angle, -6 dB
  coverage_v_deg: 45.0
  band_lo_hz: 2000.0
  band_hi_hz: 16000.0
  di_target_db: null          # derive from coverage
  di_slope_target: 0.0        # flat DI with frequency

weights: {cov: 0.2, rip: 1.0, di: 0.0, dislope: 0.0, flat: 1.0, load: 0.5}

mesh:
  epw: 6.0
  quadrants: "1"              # quarter; requires a symmetric design
  dof_cap_screen: 5000   # measured 8GB RTX 4060 (TOOLCHAIN.md M3); plan default was 8000
  dof_cap_verify: 7000
  dof_cap_final:  8900
  dof_per_triangle: 0.51       # measured M1: 0.500 full domain, ~0.51 quarter (hornlab-beat-bem 0.2.0)

solve:
  backend: beat_cuda
  distance_m: 2.0
  angle_count: 73             # must be ODD
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-5
  timeout_s: 900

search: {algorithm: cma, sigma0: 0.25, seed: 1234, budget: 200,
         popsize: null, tolfun: 1.0e-3}
