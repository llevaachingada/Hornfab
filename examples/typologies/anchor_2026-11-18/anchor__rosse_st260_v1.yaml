# ANCHOR (Fable D6 step 1, plan §10.1; cloud senior 2026-11-18). SHAPE_CHECK REQUIRED before any GPU.
# OWNER-GATED: 1-2 solves (`hornlab-search run --mode screen`, then `--mode verify`). NOT a search config:
# every bound is pinned, so `hornlab-search search` refuses it by design (zero free dimensions).
#
# WHAT: Marcel Batik's R-OSSE "ST260" practical design example (1-inch, axisymmetric, 260 mm mouth),
#   R-OSSE Acoustic Waveguide rev7 (Dec 2022), https://at-horns.eu/release/R-OSSE%20Waveguide%20rev7.pdf,
#   licence CC BY-NC-SA 4.0. Parameter values copied from the repo dossier
#   docs/research/ATH_PUBLISHED_SEEDS_80x60_2026-11-16.md Design G (fetched from the primary 2026-11-16).
#   [unverified this session]: at-horns.eu is not reachable from the cloud container; the local agent
#   re-reads the rev7 example and the ST260 page and corrects any value below BEFORE shape_check.
# WHY THIS HORN: published geometry (full parameter set + STEP/STL on the ST260 page) AND user builds with
#   acoustic measurements linked from the ST260 page; axisymmetric, so one polar orbit describes the far
#   field and H = V is a built-in self-check. Its family (R-OSSE) is already a native mesher family.
# PASS RULE (predeclared; dossier: docs/research/typologies/ANCHOR_ST260_RESEARCH_2026-11-18.md):
#   -6 dB beamwidth within +/-5 deg per 1/3-octave band, +/-3 deg in 2-5 kHz; DI within +/-1 dB,
#   same DI method on both sides; band 1-8 kHz (1-inch f11 ~ 7.9 kHz; gating below ~1 kHz).
# Labels: [published] value from the rev7 example; [assumed] not in the example, our choice.
#   [CORRECTED 2026-11-18 by the local orchestrator, D6 step 1 / R4 source check]: the rev7 example
#   values (a0 7.5 / k 1.8 / q 3.7 / m 0.8) match the rev7 paper but NOT the actual ST260 device.
#   Re-fit of the downloaded STL bore+rim (https://www.at-horns.eu/release/ST260.zip, ST260-19.stl)
#   to the same rev7 formulas gives a0=9.45 deg (19 deg total, agreeing with the ST260 page),
#   k=2.13, q=5.05, m=0.86 at RMS 0.08 mm / max 0.17 mm; the old values sit 1.33 mm RMS (max 3.5 mm)
#   off the device. r0, R, a, r, b, tmax unchanged. Evidence + comparison table:
#   docs/evidence/anchor_st260_2026-11-18/. NO admissible measured build exists (dossier section 4
#   rule): R4 fallback (ATH CORE / Tritonia) recorded there; ST260 is NOT solved in this pass.
name: anchor__rosse_st260_v1
family: R-OSSE
seed_params:
  r0_mm: 12.7          # [published] 1-inch throat, radius
  a0_deg: 9.45         # [published-STL-refit 2026-11-18] 19 deg total opening (page); rev7 example said 7.5
  a_deg: 39.0          # [published] nominal coverage half-angle (~78 deg total, round)
  R_mm: 130.0          # [published] mouth radius (260 mm mouth; STL outer lip 260.4 mm)
  k: 2.13              # [published-STL-refit 2026-11-18]; rev7 example said 1.8
  r: 0.3               # [published] (not re-fitted; weakly identified)
  b: 0.3               # [published] (not re-fitted; weakly identified)
  m: 0.86              # [published-STL-refit 2026-11-18]; rev7 example said 0.8
  q: 5.05              # [published-STL-refit 2026-11-18] R-OSSE blend exponent (not OSSE q); rev7 example said 3.7
  tmax: 1.0            # [assumed] full profile; check against the rev7 script
  exponent: 2.0        # [assumed] circle: the example is axisymmetric
  aspect_ratio: 1.0    # [assumed] axisymmetric
  morph_target: 0      # [assumed] no morph (axisymmetric)
  wall_thickness_mm: 5.0   # [published] rev7 BEM: "free standing with a 5 mm thick wall" (relabelled from [assumed])
bounds:
  r0_mm: {lo: 12.7, hi: 12.7, search: false}
  a0_deg: {lo: 9.45, hi: 9.45, search: false}
  a_deg: {lo: 39.0, hi: 39.0, search: false}
  R_mm: {lo: 130.0, hi: 130.0, search: false}
  k: {lo: 2.13, hi: 2.13, search: false}
  r: {lo: 0.3, hi: 0.3, search: false}
  b: {lo: 0.3, hi: 0.3, search: false}
  m: {lo: 0.86, hi: 0.86, search: false}
  q: {lo: 5.05, hi: 5.05, search: false}
  tmax: {lo: 1.0, hi: 1.0, search: false}
target:
  coverage_h_deg: 78.0
  coverage_v_deg: 78.0
  band_lo_hz: 1000.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
weights: {cov: 1.0, rip: 1.0, di: 0.3, dislope: 0.5, flat: 0.5, load: 0.0}
mesh:
  epw: 6.0
  quadrants: "1"
  dof_cap_screen: 12000
  dof_cap_verify: 12000
  dof_cap_final: 12000
  dof_per_triangle: 0.51
solve:
  backend: beat_cuda
  distance_m: 2.0
  angle_count: 73
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-5
  timeout_s: 900
search: {algorithm: cma, sigma0: 0.1, seed: 1234, budget: 1, popsize: null, tolfun: 1.0e-3}
