# ath_core: generalized ATH CORE 2-inch OS-SE + native Ath-style mouth morph.
#
# PRIMARY SOURCE (published recipe, CC-BY-4.0): https://at-horns.eu/core.html
#   OSSE = { L = 260, r0 = 25.0, a0 = 1.2,
#            a = 5 + 35*sf(4,12,15,16,1,0.618,p) - 15*cos(p)^10,
#            n = 6.0 + 1.5*cos(p)^2, q = 0.996, s = 0.6 + 0.23*cos(p)^2,
#            s1 = 1.14, s2 = 0.025 }
#   Morph.TargetShape = 1, Morph.FixedPart = 0, Morph.Rate = 3,
#   Morph.CornerRadius = 16.5
# FORMULA SOURCE: OS-SE Waveguide, M. Batik, section 5 (the morph law).
# GUIDE SOURCE: Ath 4.8.2 User Guide section 4.1.2 / 6.4.3 (Morph semantics).
#
# HONEST LABEL: constant-azimuth reduction of the published CORE laws. The numeric
# OSSE parameters below are the H/V midpoints (a 24.2, n 6.75, s 0.715). This is a
# framework entry for searching the CORE recipe, not a claimed exact replica: the
# published a(p)/s(p)/n(p) laws, Mesh.Roundover 42, rear-shape and enclosure are not
# represented by this native OSSE design.
#
# MORPH IS A SEARCH DIMENSION: the target shape (rectangle/circle/superellipse), the
# superellipse exponent, target widths, corner, rate and fixed part are all searched.
# morph_allow_shrinkage = 1 lets the optimiser explore targets smaller than the raw
# mouth; the guide's default (0) auto-enlarges and would remove that freedom. All
# ranges are deliberately wider than the published seed so the search is not clipped
# to a replica; the brief envelope and dof cap remain the outer constraints.
name: ath_core
family: OSSE
brief_file: ../briefs/ath_core_2in.yaml

seed_params:
  r0_mm: 25.4               # brief pins this; published script uses 25.0
  a0_deg: 1.2               # brief pins this (throat_angle_policy: pin)
  L_mm: 260.0
  a_deg: 24.2               # midpoint of published H 25.0 / V 23.4
  n: 6.75                   # midpoint of published H 7.5 / V 6.0
  s: 0.715                  # midpoint of published H 0.83 / V 0.60
  q: 0.996
  k: 1.0
  exponent: 2.0             # circular base cross-section; the morph owns the outline
  aspect_ratio: 1.0
  s1: 1.14                  # published throat-extension recipe
  s2: 0.025
  morph_target: 1           # rounded rectangle (Ath Morph.TargetShape = 1)
  morph_width_mm: 397.0     # implicit raw extent at the seed, explicit for search
  morph_height_mm: 397.0
  morph_corner_mm: 16.5
  morph_exponent: 4.0       # active only when the searched target becomes 3
  morph_rate: 3.0
  morph_fixed: 0.0
  morph_allow_shrinkage: 1

bounds:
  r0_mm: {lo: 25.4, hi: 25.4, search: false}
  a0_deg: {lo: 1.2, hi: 1.2, search: false}
  L_mm: {lo: 210.0, hi: 320.0}
  a_deg: {lo: 16.0, hi: 32.0}
  n: {lo: 3.5, hi: 9.0}
  s: {lo: 0.25, hi: 0.95}
  q: {lo: 0.96, hi: 1.0}
  k: {lo: 0.6, hi: 1.6}
  exponent: {lo: 2.0, hi: 2.0, search: false}
  aspect_ratio: {lo: 1.0, hi: 1.0, search: false}
  s1: {lo: 0.0, hi: 2.0}
  s2: {lo: 0.0, hi: 0.06}
  morph_target: {lo: 1, hi: 3}
  morph_width_mm: {lo: 300.0, hi: 500.0}
  morph_height_mm: {lo: 300.0, hi: 500.0}
  morph_corner_mm: {lo: 4.0, hi: 40.0}
  morph_exponent: {lo: 2.0, hi: 8.0}
  morph_rate: {lo: 1.0, hi: 6.0}
  morph_fixed: {lo: 0.0, hi: 0.5}
  morph_allow_shrinkage: {lo: 1, hi: 1, search: false}

target:
  coverage_h_deg: 50.0
  coverage_v_deg: 50.0
  band_lo_hz: 500.0
  band_hi_hz: 5500.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.0
mesh:
  epw: 8.0
  quadrants: '1'
  dof_cap_screen: 5000
  dof_cap_verify: 7000
  dof_cap_final: 8900
  dof_per_triangle: 0.51
solve:
  backend: beat_cuda
  distance_m: 2.0
  angle_count: 73
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-05
  timeout_s: 900
search:
  algorithm: cma
  sigma0: 0.25
  seed: 1234
  budget: 200
  popsize: null
  tolfun: 0.001
