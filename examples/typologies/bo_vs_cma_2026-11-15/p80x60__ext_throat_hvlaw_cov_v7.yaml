# HOME 80x60 STRICT-COVERAGE track (2026-11-15). Plan: docs/queue/BO_VS_CMA_PLAN_2026-11-15.md section 3.
# Brief room_80x60_700_hf1440_v7_cov (cov weight 1.0, tolerance 2.0; otherwise the home brief).
# Why: every home winner so far is ~66 x 69 deg because the ext-throat / ATH-core cells have ONE wall angle in
# every direction (the high-frequency pattern is then round) and the home brief scored coverage loosely.
# This cell gives the wall angle a horizontal/vertical difference through the ATH CORE-style law's cosine term
# (hornlab_search/design/families.py azlaw): a(p) = a_deg + az_a_cos_amp*|cos p|^pow, p = 0 is horizontal
# (shape_check: +10 deg widens the mouth width only). Seed a_deg 30 + cos 10 -> a(0) = 40 deg (H half-angle,
# 80 deg), a(90) = 30 deg (V 60 deg). The throat stays round (the law only changes the angle, not r0), so the
# round-coupling default holds. The superformula petal term is pinned at 0 (it hurt the ext-throat family on
# 2026-11-14). Morph shrinkage ON: without it the wider H angle overshoots the 600 mm width (shape_check
# 657 mm); with it the mouth is held at the 500 x 660 target (K-law for 80 x 60 at 700 Hz is 454 x 605).
# Searched (9): a_deg, L, s, throat_ext_length/angle, morph_rate, az_a_cos_amp, az_a_cos_pow, az_s_cos2_amp.
# 'ATH CORE-style' law, not a claimed ATH product.
