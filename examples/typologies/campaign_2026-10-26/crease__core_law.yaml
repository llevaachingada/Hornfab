  s1: {lo: 1.14, hi: 1.14, search: false}
  s2: {lo: 0.025, hi: 0.025, search: false}
  az_a_sf_amp: {lo: -10.0, hi: 50.0}
  az_sf_m: {lo: 4.0, hi: 4.0, search: false}
