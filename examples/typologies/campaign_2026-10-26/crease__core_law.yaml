# Cell crease__core_law - native OSSE with the PUBLISHED ATH CORE per-direction law,
# brief native_ath_core_2in.
# SOURCE: at-horns.eu/core.html published OSSE recipe (CC-BY-4.0), reproduced in
#   hornlab_search/design/families.py section "azlaw":
#     a(p) = a_deg + az_a_sf_amp*SF(p) + az_a_cos_amp*|cos p|^az_a_cos_pow
#     n(p) = n + az_n_cos2_amp*cos^2 p        s(p) = s + az_s_cos2_amp*cos^2 p
#     SF(p) = (|cos(m p/4)/a|^n2 + |sin(m p/4)/b|^n3)^(-1/n1)
#   CORE itself: a_deg 5, sf amp 35 (m 4, n1 12, n2 15, n3 16, a 1, b 0.618), cos amp -15
#   pow 10, n 6 + 1.5 cos^2, s 0.6 + 0.23 cos^2 -> a = 25.0 / 33.8 / 23.4 deg at
#   p = 0 / 45 / 90: the wider diagonals fold the walls into the creases.
# CHANGED vs shipped ath_core.yaml: the constant-azimuth midpoint (a 24.2, n 6.75, s 0.715)
#   is replaced by the published BASE + law; the law knobs replace the single a/n/s values
#   in the search. The mouth rect is pinned to the measured 399x399 seed mouth (Ath
#   TargetWidth/Height natural, shrinkage off) instead of searching a shape.
# HONEST LABEL: this now represents the published per-direction a/n/s law; Mesh.Roundover,
#   the rear shape and the enclosure are still not modelled.
# BOXES: the campaign knob table, intersected with families.KeySpec hard limits. a_deg is
#   the BASE (0-40) while the law is on; L 0.4*260 = 104 to the brief's 520 mm depth;
#   morph rate 0.5-8, corner 0-80 mm, fixed 0-0.6.
name: crease__core_law
family: OSSE
seed_params:
  r0_mm: 25.4
  a_deg: 5.0
  a0_deg: 1.2
  L_mm: 260.0
  n: 6.0
  s: 0.6
  q: 0.996
  k: 1.0
  exponent: 2.0
  aspect_ratio: 1.0
  s1: 1.14
  s2: 0.025
  az_a_sf_amp: 35.0
  az_sf_m: 4.0
  az_sf_n1: 12.0
  az_sf_n2: 15.0
  az_sf_n3: 16.0
  az_sf_a: 1.0
  az_sf_b: 0.618
  az_a_cos_amp: -15.0
  az_a_cos_pow: 10.0
  az_n_cos2_amp: 1.5
  az_s_cos2_amp: 0.23
  morph_target: 1
  morph_width_mm: 399.0
  morph_height_mm: 399.0
  morph_corner_mm: 16.5
  morph_exponent: 4.0
  morph_rate: 3.0
  morph_fixed: 0.0
  morph_allow_shrinkage: 0
