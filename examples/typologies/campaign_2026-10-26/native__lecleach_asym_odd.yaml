# SOURCE: LANE_A_LECLEACH.md s3.6 (native asym row: fc 800 [740,900], T 0.8 [0.6,1.0],
#   stop 170 [150,200], eps 0.10 [0,0.15], eps_start 0.2 [0,0.4]; full ring; measured
#   235x240x116, 3,338 dofs).
# SYMMETRY NOTE: `span: half_xz` landed in 935e560, but beat_bem rejects the xz native
#   symmetry plane (see docs/ISSUES.md), so a GPU beat_cuda half model would be refused.
#   This cell therefore KEEPS `span: full` + quadrants '1234' (the only GPU-legal route).
# CHANGED vs shipped: brief -> native control; seed_policy explicit; eps 0.10 / eps_start
#   0.2; bounds per LANE_A; mesh epw 6 (was 8), caps 12000; solve cuda_fused true;
#   CMA sigma0 0.15 seed 1234.
name: native__lecleach_asym_odd
family: FREEFORM
