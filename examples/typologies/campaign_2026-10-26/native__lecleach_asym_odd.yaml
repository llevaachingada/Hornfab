  n_phi: 25
  n_s: 32
  wall_thickness_mm: 3.0
  span: full
  seed_policy: explicit
seed_params:
  g_fc_hz: 800.0
  g_T: 0.8
  g_stop_deg: 170.0
  g_eps_m: 0.1
