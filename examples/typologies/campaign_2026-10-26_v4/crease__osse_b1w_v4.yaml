# OBJECTIVE v4 TWIN (generated by tools/make_v4_campaign.py): identical geometry, bounds and mesh
# settings to the v3 cell of the same name; only the brief (objective v4) and the name differ.
# Cell crease__osse_b1w - native OSSE with the per-direction wall-angle law on the b1w seed,
# brief b1w_hifi_90x60_850_wide.
# SOURCE: the campaign crease experiment (the ATH CORE construction as a native OSSE law):
#   a(p) = a_deg + az_a_sf_amp*SF(p) + az_a_cos_amp*|cos p|^az_a_cos_pow
#   n(p) = n + az_n_cos2_amp*cos^2 p        s(p) = s + az_s_cos2_amp*cos^2 p
#   SF(p) = (|cos(m p/4)/a|^n2 + |sin(m p/4)/b|^n3)^(-1/n1)
#   This cell uses a softer version than CORE: a_deg 10 so a(0) = 10 + 30 - 10 = 30 (b1w's
#   seed angle), sf amp 30 at the published sf shape (m 4, b 0.618), and NO n/s modulation
#   (az_n_cos2_amp = az_s_cos2_amp = 0). 0 / 45 / 90 deg then give a = 30.0 / 34.8 / 25.8.
# CHANGED vs b1w__osse_baseline: the single a = 30 deg is replaced by base + law; the rect
#   Morph is switched ON and pinned to the measured 335.0 x 291.3 mm seed mouth (shrinkage
#   off); rate/corner/fixed are searched, exponent pinned 2 (the mesher needs a circular
#   cross-section for a clean law), aspect stays b1w's 1.15 (aspect 1.0 would push the V
#   mouth to 335 mm, outside the 300 mm envelope). r0 stays 18.0 (brief driver).
# BOXES: campaign knob table intersected with families.KeySpec hard limits. a_deg is the
#   BASE (0-40); L 0.4*140 = 56 to the brief's 400 mm depth; morph rate 0.5-8, corner
#   0-80 mm, fixed 0-0.6.
