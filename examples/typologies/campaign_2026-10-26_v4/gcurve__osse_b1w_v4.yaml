# OBJECTIVE v4 TWIN (generated by tools/make_v4_campaign.py): identical geometry, bounds and mesh
# settings to the v3 cell of the same name; only the brief (objective v4) and the name differ.
# Cell gcurve__osse_b1w - native OSSE with the OS-SE GUIDING CURVE on the b1w seed,
# brief b1w_hifi_90x60_850_wide.
# SOURCE: the ATH CORE / TwinRay construction (at-horns.eu; OS-SE Waveguide, M. Batik section 5):
#   a superellipse mouth curve makes the coverage angle change with direction around the axis.
#   type 1 = superellipse; the mesher requires a circular cross-section while a guiding curve
#   is on, so exponent is pinned 2.0 and aspect_ratio 1.0.
# RESEED 2026-10-27 (smoke night, final): gcurve_type 1 (pinned), rot 0 (pinned), **dist 1.0**,
#   se_n 4, aspect 0.7, **width 335.0** (b1w's measured mouth width).
#   WHY DIST 1.0: the mesher solves the OSSE coverage angle so the wall meets the guiding curve at
#   `gcurve_dist x L` from the throat. At the original dist 0.5 the 335 mm outline sat halfway down
#   the horn while the flare kept growing to the mouth, and the full mirrored mouth measured
#   783 x 581 mm - a seed that could not even be meshed inside the 380 x 300 brief envelope. At
#   dist 1.0 the outline IS the mouth, so width 335 is again the mouth width: the measured full
#   envelope is 335 x 291 mm (bbox_m 0.1676 x 0.1457 after the quarter mirror, depth 146 mm).
#   The brief envelope is checked on the FULL mirrored mouth, not the quarter bbox, which is why
#   the old failure read 783 mm wide. `families.KeySpec` has no lo/hi clamp on `gcurve_dist`, and
#   the mesher's own formula accepts 0 < dist <= 1.0 as a fraction of L (above 1.0 it would be an
#   absolute z in metres), so 1.0 is the allowed upper end - hence the box upper bound.
#   Morph cannot pull the outline back (morph_allow_shrinkage is off), so the seed itself must be
#   inside the envelope; the old smaller-width workaround (dist 0.5, width 130) was rejected in
#   favour of fixing the station, because it changed the intended mouth scale.
#   The underlying OSSE geometry is b1w's seed exactly (r0 18, a 30, L 140, n 4, s 0.7, q 0.995,
#   k 1) with the rect Morph pinned to the 335.0 x 291.3 mm seed mouth (shrinkage off). The curve
#   only changes the outline; rate/corner/fixed are searched.
# CHANGED vs b1w__osse_baseline: guiding curve switched ON; aspect_ratio 1.15 -> 1.0 (the
#   mesher's guiding-curve requirement - the curve, not the cross-section, makes the wide
#   mouth); exponent 4 -> 2; Morph switched on; L/a_deg/gcurve_* searched.
# BOXES: campaign knob table intersected with families.KeySpec hard limits. L 0.4*140 = 56
#   to the brief's 400 mm depth; gcurve width 0.3-1.1 x 335 = 100.5-368.5 mm; dist 0.2-1.0,
#   se_n 2-8, aspect 0.4-1.6; morph rate 0.5-8, corner 0-80 mm, fixed 0-0.6.
