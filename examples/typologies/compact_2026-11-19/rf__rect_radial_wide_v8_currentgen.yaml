# CURRENT-GENERATOR RE-EMIT (2026-11-19), candidate A5, from the unchanged
# examples/typologies/rolled_family_2026-11-15/rf__rect_radial_wide_v7.yaml.
#
# This file is NOT a reproduction of the archived 2026-11-15 A5 shape. The archived saved recipe
# carries a pre-2026-11-16 schema/implementation_sha256 that rolled_family.py refuses BY DESIGN, so
# the archived saved design cannot be rebuilt from its own rows. This config re-emits the same A5
# knobs as a config the CURRENT rolled_family generator materialises and scores.
#
# Consequence: any A/B between this file and the archived v7 saved design is MECHANISM-LEVEL, not
# geometry-identical. Under the current generator this seed materialises the same geometry the
# unchanged v7 config does; the non-reproducible reference is the archived saved mesh.
#
# Only `name` differs from v7. `rows` deliberately carries no schema/implementation_sha256/driver:
# rolled_family.design_params injects the current schema, the current implementation digest and the
# driver from the brief. The driver is the shared HF1440 entry (exit_radius_mm 18.0,
# exit_angle_deg 2.0) in
# briefs/home_landscape_2026-11-15/room_landscape_80x50_700_hf1440_v7.yaml, so no explicit driver
# block is needed or invented here.
#
# Same mechanism as v7: canonical rolled_family RADIAL relief on the Crowe-ES spiral base.
#   rho_new = rho - (H*cos^2(psi) + V*sin^2(psi)) * cos^2(2*psi) * window
# Positive H/V pull the horizontal/vertical wall centres inward; the normalized diagonal is
# unchanged (ATH-like diagonal ridge / triangular facet direction). Window 0.50/0.80/0.96 keeps
# the source and the returned lip untouched.
