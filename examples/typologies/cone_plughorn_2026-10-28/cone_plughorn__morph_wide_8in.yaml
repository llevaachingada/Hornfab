# cone_plughorn__morph_wide_8in - LABELED HYPOTHESIS-SHAPE EXPERIMENT (cone mid horn + axe head, horn-theory morph knobs).
# Evo 2SH topology (8-inch) driven by the morph knobs (seeded to reproduce the CAD).
# Morph knobs (tools/cad/plughorn.py PlughornParams.resolve_morph): compression ratio + axe-head base -> throat;
# wall angles -> coverage; mouth corner + roll-out -> termination; axe head relative to the horn. generator.fixed
# carries the source horn's raw shapes (throat/base/roll proportions) the morph scales.
# Seed vs source CAD: max raw difference 0.5 mm. Derived: CR 6.48, walls 31.6/13.6 deg, K-law pattern H 930 Hz / V 3409 Hz, mouth cut-off 243 Hz, clearance 2.67 mm.
# solve.source_motion axial: the cone moves as a rigid piston (see docs/research/HANDOFF_CONE_DRIVER_MODEL_2026-10-28.md).
