  distance_m: 10.0
  angle_count: 73
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-05
  timeout_s: 900
  cuda_fused: true
search:
  algorithm: cma
  sigma0: 0.2
  seed: 1234
  budget: 200
  popsize: null
  tolfun: 0.001
  infeasible_penalty: graded
  budget_counts: valid
  max_attempts: 300
description: OWNER-GATED CROWE V2A four-DOF box (height, length, area bias, aspect timing); not queued, no solve authorised
