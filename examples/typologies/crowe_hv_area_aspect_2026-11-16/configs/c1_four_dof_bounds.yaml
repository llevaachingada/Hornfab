#
# NOT QUEUED. The V2A addendum authorises no new solve; this file only makes the four-variable
# Phase-1 box concrete and loadable. Exactly four search dimensions:
#   height_v_active_mm, L_forward_mm, area_mid_bias, aspect_timing_u50.
# width_h_active_mm / p_mouth / throat_round_hold_mm are fixed in the generator block and are
