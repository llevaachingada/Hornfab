name: crowe_aa__c1_v2a_four_dof_bounds
family: FREEFORM
brief_file: ../../../briefs/home_landscape_2026-11-15/room_landscape_80x50_700_hf1440_v7_smooth.yaml
generator:
  name: crowe_hv_area_aspect_v1
  n_anchors: 29
  wall_thickness_mm: 3.0
  width_h_active_mm: 580.0
  p_mouth: 3.25
  throat_round_hold_mm: 0.0
  seed_policy: explicit
seed_params:
  height_v_active_mm: 474.0
  L_forward_mm: 300.0
  area_mid_bias: 0.0
  aspect_timing_u50: 0.5
bounds:
  height_v_active_mm: {lo: 300.0, hi: 474.0}
  L_forward_mm: {lo: 220.0, hi: 340.0}
  area_mid_bias: {lo: -0.15, hi: 0.15}
  aspect_timing_u50: {lo: 0.35, hi: 0.65}
mesh:
  epw: 6.0
  quadrants: '1'
  dof_cap_screen: 24000
