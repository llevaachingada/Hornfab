# ATH OSSE on the HOME LANDSCAPE brief, anchored to the published Tritonia kit-era law. 2026-11-16.
# WHY v8 (the v7 cell was stopped mid-run ~04:35Z, owner: "totally wrong geometry / wrong ridge bounds"):
#   v7 seeded the milder 2025 web law (at-horns.eu/ext/Tritonia.txt: 48.5 - 7cos(2p)^5 - 16sin(p)^12,
#   H 41.5 / V 39.5 deg - only ~2 deg H-V swing) AND let CMA search the fold + morph open
#   (cos2p amp up to +10 i.e. the inverted fold, corner down to 0, morph_fixed to 0.4): the run
#   produced a smooth symmetric pillow bowl without the Tritonia boat folds (evidence in
#   docs/CONTINUITY 2026-11-16 and the stopped run 20261116T041232Z-screen-b5380a).
# WHAT v8 anchors (source table in docs/research/typologies/ATH_PUBLISHED_SEEDS_80x60_2026-11-16.md,
#   numbers from this repo's parity test: forks/hornlab-waveguide-mesher/tests/test_ath_reference_parity.py,
#   the 260308tritonia kit-era reference):
#   a = 49.5128 - 14.8405*cos(p)^2 - 29.2180*sin(p)^8  ->  H 34.7 / V 20.3 / diag 40.3 deg
#   (14.4 deg H-V swing, sharp meridian fold), a0 8.0307, k 1.0910, n 6.0455, q 0.98349, s 0.9859,
#   morph Rate 1.6002, CornerRadius 18, rounded-rect target, no throat stretch (no s1/s2 law).
# The az knobs carry the law exactly: az_a_cos_amp/az_a_cos_pow (|cos p|^2 term) and
#   az_fold_v_deg/az_fold_v_width_deg (|sin p|^m, half depth 23.508 deg = m 8). Fold_h and the
#   cos(2p) tilt are pinned off - the kit law folds only the vertical meridian. s1/s2 pinned
#   (no stretch). Bounds keep the law shape within +-~1.2 deg of the published values and leave
#   coverage/size to a_deg, a0, L, morph W/H/rate/corner. The inline target is 80 H x 50 V to match
#   the brief (the v7 inline value said 60 V and was silently overridden - fixed here).
# Offline seed mesh (CPU) renders the meridian fold + shifted diagonals; polar verification happens
#   in the queued search runs (a_tritonia2_*).
# 2026-11-16 08:xx: watchdog bound-pins widened {'morph_rate': (0.6, 2.1), 'az_a_cos_amp': (-22.0, -13.5)}; seed = best of runs/20261116T044917Z-screen-12eb61 (J 5.692). Name kept so the BO cohort stays one task.
