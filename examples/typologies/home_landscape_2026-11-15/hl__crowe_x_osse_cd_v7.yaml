# HOME CROWE-X ON A CD THROAT (2026-11-15 study, docs/research/typologies/BIRADIAL_CROWE_STUDY_2026-11-15.md).
# Crowe's ES look (X creases from the throat to the four corners, bow-tie outline, rolled lip) on the osse_rollback rows:
# per-azimuth OSSE wall a(phi) = a_h cos^2 + a_v sin^2 (Magnus's profile_points; constant directivity), Gielis
# superformula X (m 4) ramping in after 25% of the wall, tangent-continuous curled lip. Labelled hypothesis shape,
# NOT Crowe's (exponential) geometry: his ES flare beams at HF by design (his own ES-600 report: 45 deg -4..-10 dB above
# 2 kHz); here the CD throat sets HF coverage (a_h 33-40 / a_v 20-28 half-angles ~ the 80 x 50 target; the BO winner
# uses 38 / 24). Study findings that set this box:
#  - the fork's round-3 seeds (a_h 24 / a_v 14) were ~48 x 28 deg at HF: too narrow, they only shrank to fit 600 mm;
#  - OSSE termination n = 4 packs the mouth flare into the last ~20 mm (flat 'plate' side view); n 1.8-3.2 spreads it
#    into a bowl; the flare adds ~0.9 s L (n 2) vs 0.64 s L (n 4), so s 0.2-0.45 keeps W <= 600;
#  - the 'chunky bar' rim is the lip: r_lip >= 30 with wrap >= 140 (old seeds) is a thick bar and overshoots W;
#    lip 8-30 mm / wrap 80-160 deg are searched so the BEM decides whether a big roll pays.
# Fixed for the look: sf_m 4, sf_n1 1.8 (between round and star), sf_n2 7 (straight edges), sf_start 0.25, k 1, q 0.996.
# 2026-11-16 08:xx: watchdog bound-pins widened {'g_L_mm': (200.0, 320.0)}; seed = best of runs/20261116T074832Z-screen-620f81 (J 5.344). Name kept so the BO cohort stays one task.
# 2026-11-18 senior review: the 320 widening above is NOT in the bounds (g_L_mm hi: 285.0 is what
# the search uses); intent was an owner question (docs/knowledge/contracts/crowe_v2a_and_crowe_x_osse.md).
# RESOLVED 2026-11-18 (R13, OWNER_DECISIONS_RESOLVED_2026-11-18.md): hi stays 285 for this lane (its
# identity and BO cohort stay intact). A longer-L exploration is a NEW config (`_v8`, g_L_mm hi 320) only
# after shape_check of the 320 mm corner against the 480 mm depth box AND with search.warm_start + a
# stated reason (D4: this lane is no_headroom). Comments only; config_sha unchanged.
