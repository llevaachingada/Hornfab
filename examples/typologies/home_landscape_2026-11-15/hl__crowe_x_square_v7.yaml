# CROW-X-INSPIRED NEAR-SQUARE PROBE (2026-11-15 owner look study).
# The reference is a near-square waveguide with four concave panels and a sharp diagonal
# ridge: the side/vertical walls pucker inward and the diagonal is the ridge. This is the
# osse_rollback family (per-azimuth CD wall + Gielis superformula X + tangent-continuous
# rolled lip), not the landscape rolled ES spiral. It is a LABELLED HYPOTHESIS SHAPE, not
# Crowe's proprietary geometry. A 479 x 479 square mouth fits the 480 mm home envelope but
# will not hold the 50-degree vertical target at 700 Hz; this cell is look-first.
name: hl__crowe_x_square_v7
family: FREEFORM
brief_file: ../../briefs/home_landscape_2026-11-15/room_landscape_80x50_700_hf1440_v7.yaml
generator:
  name: grid
  rows: {type: osse_rollback}
  n_phi: 33
  n_s: 56
  wall_thickness_mm: 3.0
  seed_policy: explicit
  span: quarter
seed_params:
  g_a_h_deg: 34.0
  g_a_v_deg: 34.0
  g_k: 1.0
  g_L_mm: 220.0
  g_s: 0.32
  g_n: 2.0
  g_q: 0.996
  g_r_lip_mm: 24.0
  g_wrap_deg: 120.0
  g_sf_m: 4
  g_sf_n1: 1.5
  g_sf_n2: 6.0
  g_sf_ab: 1.0
  g_sf_amt: 0.60
  g_sf_start: 0.12
bounds:
  g_a_h_deg: {lo: 32.0, hi: 36.0}
  g_a_v_deg: {lo: 32.0, hi: 36.0}
  g_k: {lo: 1.0, hi: 1.0, search: false}
  g_L_mm: {lo: 210.0, hi: 240.0}
  g_s: {lo: 0.25, hi: 0.40}
  g_n: {lo: 1.8, hi: 2.4}
  g_q: {lo: 0.996, hi: 0.996, search: false}
  g_r_lip_mm: {lo: 18.0, hi: 30.0}
  g_wrap_deg: {lo: 90.0, hi: 150.0}
  g_sf_m: {lo: 4, hi: 4, search: false}
  g_sf_n1: {lo: 1.5, hi: 1.5, search: false}
  g_sf_n2: {lo: 6.0, hi: 6.0, search: false}
  g_sf_ab: {lo: 1.0, hi: 1.0, search: false}
  g_sf_amt: {lo: 0.40, hi: 0.80}
  g_sf_start: {lo: 0.12, hi: 0.12, search: false}
mesh: {epw: 6.0, quadrants: '1', dof_cap_screen: 24000, dof_cap_verify: 24000, dof_cap_final: 24000, dof_per_triangle: 0.51}
solve: {backend: beat_cuda, distance_m: 10.0, angle_count: 73, balloon: true, balloon_points_screen: 512, balloon_points_verify: 1024, gmres_tol: 1.0e-05, timeout_s: 900, cuda_fused: true}
search: {algorithm: cma, sigma0: 0.2, seed: 1234, budget: 25, popsize: null, tolfun: 0.001, infeasible_penalty: graded}
description: 'Near-square Crowe-X-inspired probe: four concave panels, diagonal ridge, 479x479 mouth; look-first, not Crowe geometry'
