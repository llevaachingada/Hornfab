# Elliptically stretched KLANGFILM spherical-wave horn: exact port of Dr. Bernd Ahlswede's calculator
# (Klangfilm_Elliptical_Horn_Calculator_diy_v10.xlsm, VBA draw_klangfilm; Kolbrek 2007). Geometry:
# tools/geometry/klangfilm_ellipse.py (matches the macro's stored output to 0.001 mm). Entry point for search AND
# verify: tools/geometry/klangfilm_ellipse_cli.py. Knobs: fc_hz (r0 = c/(pi fc): size and curl radius), stretch
# (H/V aspect at the widest point; round at the throat), end_frac (h_end/r0: 1.0 = mouth perpendicular, ->1.85 deep
# rollback). Spherical-wave horns narrow with frequency -> smooth brief. Non-commercial (author's terms).
# 2026-11-16 owner: + bend_radius_mm (front arc seen from above: centre line forward, sides back; V lips ahead of H lips)
# + throat_ellipse (round driver exit -> ellipse wider H soon after; 1.0 = calculator ramp; < 0.3 squeezes V below the exit).
name: hl__klangfilm_ellipse_smooth_v7
family: FREEFORM
brief_file: ../../briefs/home_landscape_2026-11-15/room_landscape_80x50_700_hf1440_v7_smooth.yaml
generator:
  name: grid
  rows:
    type: klangfilm_ellipse
  n_phi: 19
  n_s: 64
  wall_thickness_mm: 3.0
  seed_policy: explicit
  span: quarter
seed_params:
  g_fc_hz: 560.0
  g_stretch: 1.6
  g_end_frac: 1.5
  g_bend_radius_mm: 400.0
  g_throat_ellipse: 0.4
bounds:
  g_fc_hz:
    lo: 480.0
    hi: 800.0
  g_stretch:
    lo: 1.15
    hi: 2.2
  g_end_frac:
    lo: 1.0
    hi: 1.85
  g_bend_radius_mm:
    lo: 320.0
    hi: 3000.0
  g_throat_ellipse:
    lo: 0.3
    hi: 1.0
mesh:
  epw: 6.0
  quadrants: '1'
  dof_cap_screen: 24000
  dof_cap_verify: 24000
  dof_cap_final: 24000
  dof_per_triangle: 0.51
solve:
  backend: beat_cuda
  distance_m: 10.0
  angle_count: 73
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-05
  timeout_s: 900
  cuda_fused: true
search:
  algorithm: cma
  sigma0: 0.25
  seed: 1234
  budget: 60
  popsize: null
  tolfun: 0.001
  infeasible_penalty: graded
  budget_counts: valid
  max_attempts: 150
description: HOME LANDSCAPE elliptical Klangfilm spherical-wave horn (Ahlswede 2018 calculator port), smooth brief
