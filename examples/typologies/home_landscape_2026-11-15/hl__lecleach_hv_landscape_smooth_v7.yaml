# Le Cleac'h (Fourcade verified march, rows type `lecleach`) H/V PAIR, REPAIRED 2026-11-16 (item 13):
# the old per-azimuth reading built ONE COMPLETE march per azimuth at fc(phi)/stop(phi) and lofted
# them point by point -> rows of ~2.3x different length never form one horn (rim non-elliptical by
# 11% at the seed / 183% at a box corner, axially non-planar by 155-319 mm) = the rejected lobed,
# bulbous body (run 20261116T040651Z-screen-e53ae9).
# The published construction now implemented (grid.py _rows_lecleach_hv_marches):
#   ONE round core march at fc_core = sqrt(fc_h*fc_v) gives the shared wavefront stations x(s)
#   (including the rollback curl -> the lip is the same smooth continuous rollback on every
#   azimuth); the plane marches at fc_h (phi=0) and fc_v (phi=90) give the section semi-axes;
#   each section is the ellipse through the axes, area-corrected (pi a b = pi r_m^2). H/V comes
#   from the expansions themselves, not from a mouth stretch. Sources (author primaries):
#   sphericalhorns.net 2020-12-21 "JMLC inspired horn calculator" (round base = wavefront areas;
#   per-plane PETF/hvdiff differing) and 2019-08-05 "Ellipsoidal wave fronts in horns" (eqs 10-12
#   area preservation). Dossier: docs/research/typologies/LECLEACH_HV_ELLIPSOID_2026-11-16.md.
# Owner references (docs/queue/lecleach_refs_2026-11-16): 4.png target look - long slim round
# throat, large rollback lip curling past 180 deg, horizontal flare much bigger than the vertical,
# lip continuous all the way round. jmlc_300_rnd / jmlc_HVDiff_2/3 archived next to it.
# Seed from the references: fc_h 450 / fc_v 800 (W*fc_h = H*fc_v invariant, ratio 1.78), T 0.6,
# stop 200 (deep rollback past 180), stop_cos2k 0.15 (a2 = different rollback depth per plane,
# 2nd owner reference: 230 deg at the H plane / 170 deg at the V plane). Narrowing family ->
# smooth brief. fc_v box 450-1150 (ratio cap 4.0 = g code gate; the published asymmetric-JMLC
# product territory is a ratio of 1.5-3.0 (920x330 datasheet = 567/203 = 2.8); the old 1400
# corner = 4.67 exceeded it and fed the 183% bulge corner).
# 2026-11-16 (item 13): the per-plane stop gate only prices the two PLANE stops now
# (interior azimuths are ellipse interpolations, not marches). Joint (stop, a2) box tightened
# so ~90% of uniform samples clear the plane gate. 2026-11-16 OWNER DECISIONS (render pack
# scratch\r_grid\grid_sheet.png + r_photo2\approval_pack.png, 12-option grid):
#   seed = option 12 (fc_h 340 / fc_v 520, T 1.0, stop 215, a2 +0.05 -> 553x364x242 mm, duct
#   included angle 16.0 deg, L0 394 mm, depth ~0.44 of width, closest render to the photos in
#   the T range); lip g_r_lip_mm PINNED 0 (the fat rolled look comes from the deep stop; the
#   torus lip only meshes at shallow stops - measured on old and new path, 2t+2 clearance);
#   T box widened to 0.4-1.0 for the seed; boxes fc_h 300-750 / fc_v 450-1000 (ratio cap 4.0
#   code gate; published asymmetric territory ratio 1.5-3.0).
