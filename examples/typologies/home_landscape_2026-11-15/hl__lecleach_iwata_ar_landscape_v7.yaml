name: hl__lecleach_iwata_ar_landscape_v7
family: FREEFORM
brief_file: ../../briefs/home_landscape_2026-11-15/room_landscape_80x50_700_hf1440_v7.yaml
generator:
  name: grid
  rows: {type: iwata_ar}
  n_phi: 15
  n_s: 32
  seed_policy: explicit
  wall_thickness_mm: 3.0
seed_params: {g_fc_hz: 550.0, g_T: 0.5, g_stop_deg: 180.0, g_ar_m: 1.5, g_ar_p: 1.0}
bounds:
