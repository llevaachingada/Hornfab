  g_T: {lo: 0.5, hi: 0.5, search: false}
  g_stop_deg: {lo: 110.0, hi: 200.0}
  g_ar_m: {lo: 1.2, hi: 2.4}
  g_ar_p: {lo: 0.5, hi: 2.0}
