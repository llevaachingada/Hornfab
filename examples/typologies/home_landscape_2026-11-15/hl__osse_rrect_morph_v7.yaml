# HOME LANDSCAPE, ATH-style smooth OSSE with a ROUNDED-RECTANGLE landscape mouth (2026-11-15).
# Research basis (2026-11-15): real ATH-style waveguides are SMOOTH OS/R-OSSE profiles whose mouth morphs to a
# rounded rectangle (an at-horns/diyAudio ATH4 example morphs back from a 320 x 240 mm landscape rectangle); surface
# shaping is gentle (mild wall bumps), never flutes/star points. Geddes: diffraction scales with the surface's 2nd
# derivative, so sharp creases/points/knife edges raise HOMs. Owner review rejected the extreme first seeds.
# This is the modern ATH recipe: smooth OSSE profile, mouth morphed (shrinkage on) to a rounded rectangle whose
# width box (480-600) sits above its height box (320-460) - landscape by construction, sized by the walls/envelope,
# NOT by Keele's mouth rule. Corner radius 30-100 mm (no sharp corners), superellipse exponent 4. A mild cosine
# wall-angle term (0-15 deg, seed 8) adds H > V inside the horn; no petal term.
# mesh.rear_res_factor 1.5 (2026-11-15): coarser outer shell / rear cap only (13 Nov audit -16..21 % DOF).
