# ROSSE-RECT CD 50-valid NEGATIVE-b VARIANT (2026-11-17), PREPARED, NOT LAUNCHED.
# Owner asked what g_b does and whether the lower bound should allow slightly negative values.
# The R-OSSE b term is an axial bow (x += b L (sqrt(r^2+(1-m)^2)-sqrt(r^2+m^2)) t^2):
# positive pulls the mouth/lip back (more rollback), negative pushes it forward (less rollback).
# The live 50-run's top designs sit at b ~= 0.002 (the old low bound), so the box is binding.
#
# REAL-MESHER CHECK (2026-11-17, CPU, shape_check.check on this seed): b = -0.01, -0.02, -0.05,
# -0.10 all built cleanly; axial span grew 422 -> 433 -> 449 mm, still inside the 480 mm brief
# envelope. tools/geometry/rosse_rect.py now allows b >= -0.10; this config uses a conservative
# -0.05 low bound, "slightly negative", not the full tested floor.
#
# SEED: current 50-run best 38aeaee3413b, J 3.7262 (n=2 of run 20261117T053153Z-screen-15f0e4);
# its own b is 0.00161 and is inside the new box. If the live 50-run improves before this is
# launched, refresh the seed from its best row first (do not launch a stale seed).
# Everything else (brief/scoring, other boxes, mesh/solve) is the r50 refinement recipe.
