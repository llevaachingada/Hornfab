# HOME LANDSCAPE Salmon flute cell (2026-11-15). Brief room_landscape_80x50_700_hf1440_v7 (no K-law; vertical half-weighted).
# Parent: ripple_ridge_2026-10-27_v4/ripple__salmon_x_flute8_b1t_v4 (Salmon elliptical rows + X modulation + an 8-lobe
# radius flute that opens at 2 % of the wall, i.e. flutes running THROUGH the throat/body, not lip ripples: the
# 2026-11-13 ablation found lip-only ripples did not move the field). The parent was a TALL brief (fc_h > fc_v gave a
# tall mouth). Retargeted: the fc pair is flipped so the horizontal row marches at the LOWER cutoff (fc_h box below the
# fc_v box), which on this generator gives the wider W extent (checked: fc_h 633 / fc_v 926 -> 395 x 288; swapped -> 287 x 396); throat = brief exit r 18 mm round.
# LABELED HYPOTHESIS-SHAPE EXPERIMENT; no published name.
# Searched (8): fc_h, fc_v, T, stop, x_amp, x_fc, flute amp, flute start.
name: hl__salmon_x_flute8_landscape_v7
family: FREEFORM
brief_file: ../../briefs/home_landscape_2026-11-15/room_landscape_80x50_700_hf1440_v7.yaml
generator:
  name: grid
  rows: {type: salmon_elliptical}
  n_phi: 25
  n_s: 32
  wall_thickness_mm: 3.0
  seed_policy: explicit
  span: half
seed_params: {g_fc_h_hz: 633.0, g_fc_v_hz: 926.0, g_T: 0.4, g_stop_deg: 110.0, g_x_amp: -0.07, g_x_fc: 0.15,
  g_ripple_lobes: 8, g_ripple_amp_mm: 24.0, g_ripple_start: 0.02}
bounds:
  g_fc_h_hz: {lo: 450.0, hi: 900.0}
  g_fc_v_hz: {lo: 700.0, hi: 1400.0}
  g_T: {lo: 0.3, hi: 1.0}
  g_stop_deg: {lo: 90.0, hi: 140.0}
  g_x_amp: {lo: -0.2, hi: 0.2}
  g_x_fc: {lo: 0.0, hi: 0.3}
  g_ripple_lobes: {lo: 8, hi: 8, search: false}
  g_ripple_amp_mm: {lo: 8.0, hi: 40.0}
  g_ripple_start: {lo: 0.0, hi: 0.3}
description: 'HOME LANDSCAPE 80Hx50V: Salmon X rows + 8 throat-to-mouth flutes, fc_h < fc_v for a wide mouth, 1.4in round throat, no K-law'
mesh: {epw: 6.0, quadrants: '14', dof_cap_screen: 24000, dof_cap_verify: 24000, dof_cap_final: 24000, dof_per_triangle: 0.51}
solve: {backend: beat_cuda, distance_m: 10.0, angle_count: 73, balloon: true, balloon_points_screen: 512, balloon_points_verify: 1024,
  gmres_tol: 1.0e-05, timeout_s: 900, cuda_fused: true}
search: {algorithm: cma, sigma0: 0.2, seed: 1234, budget: 80, popsize: null, tolfun: 0.001, infeasible_penalty: graded}
