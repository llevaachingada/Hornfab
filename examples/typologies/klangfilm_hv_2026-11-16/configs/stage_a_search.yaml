# STAGE A SEARCH BOX (Phase A Klangfilm-Lame H/V throat core, schema klangfilm-lame-hv-v1).
# Kernel: tools/geometry/klangfilm_lame_hv.py. Parent (read-only): tools/geometry/klangfilm_lame.py.
#
# Four searched dimensions only, per the 2026-11-16 handoff section 4/7 "Stage A":
#   g_theta_h0_deg      6.0 .. 17.0   true H wall half-angle at the throat (not a beamwidth half-angle)
#   g_theta_v0_deg      3.0 .. 13.0   true V wall half-angle, independent of H
#   g_h_mid_gain_mm     0.0 .. 20.0   positive-only H mid spread at the join (measured wall)
#   g_v_mid_gain_mm     0.0 .. 3.75   positive-only V mid spread at the join (measured wall)
# Everything else is pinned: the canonical incumbent genes, cd_core_blend = 1.0, join 0.65.
#
# Why the gains are positive-only here: the handoff's first-pass ranges (-12..+35 H, -20..+15 V)
# are NOT lawful in this parameterisation. The B2 basis ramps as t^3, so a negative mm gain locally
# dominates the V wall slope: measured at the canonical incumbent (join 0.65) the feasible negative
# V gain is about -0.04 mm before the forward V radius stops being non-decreasing, and the
# handoff's -8 mm seed already drops the V semi-axis to 15.02 mm at z ~ 61.8 mm (below the 18 mm
# throat). The kernel refuses both instead of clamping. The lawful Stage A box is therefore the
# positive quadrant; the negative-V "tighter interior" idea belongs to the Phase B integrated-slope
# core, where a lower-but-positive slope is monotone by construction.
#
# Positive upper bounds are measured too, not guessed: at join 0.65 the forward-radius monotonicity
# wall is 20.5-21.5 mm for the H gain and 4.0-5.5 mm for the V gain (the V wall falls as theta_V
# rises, because a tighter throat leaves less slope for the B2 term to eat). 20.0 / 3.75 keep a
# margin, so the whole box is lawful (see SEARCH_BOX.md; 200/200 LHS samples accepted).
# Lawfulness of this box is measured, not assumed:
#   .venv\Scripts\python.exe tools/geometry/klangfilm_hv_search_box.py
#
# NOT queued. No solve, no objective change, no acoustic claim. Owner authorises any GPU run.
