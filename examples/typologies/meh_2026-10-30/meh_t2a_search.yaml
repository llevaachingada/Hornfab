# T2-A MEH SEARCH seed: 2 x B&C 6NDL38 top/bottom + FaitalPRO HF1440, no fill (C1, C9, C11).
#
# Same geometry as meh_t2a.yaml, but authored through the `meh` GENERATOR so the C9 knob box is
# searchable: cov_h_deg, cov_v_deg, z_frac, across_frac, port_along_mm, slide_mm. Everything the
# search must not move (envelope, wall thickness, driver-derived values) is in generator.fixed.
#
# The seed's slide_mm is 32, not the C9 default 10: at L1 the default slide puts the 6NDL38 behind
# the HF1440 body and the CAD repair walks it 10 -> 32 mm in 2 mm steps (M8 readiness link 1,
# docs/evidence/MEH_M8_2026-10-31.md). 32 is inside the C9 range and needs no repair.
name: meh_t2a_search
family: FREEFORM
brief_file: ../../briefs/meh_2026-10-30/meh_home_90x60_t2.yaml
generator:
  name: meh
  seed_policy: explicit
  fixed:
    walls: tb
    env_w_mm: 406.4
    env_h_mm: 406.4
    env_d_mm: 380.0
    box_t_mm: 18.0
    roll_mm: 20.0
    wall_t_mm: 6.0
    spacer_mm: 3.0
    exit_mm: 35.8          # FaitalPRO HF1440
    cd_duct_mm: 40.0       # C9 [inferred]
    cd_body_d_mm: 124.0
    cd_body_len_mm: 75.0
    cone_cutout_mm: 145.0  # B&C 6NDL38
    cone_depth_mm: 85.0
    clearance_mm: 3.0
seed_params:
  cov_h_deg: 90.0
  cov_v_deg: 60.0
  z_frac: 0.25
  across_frac: 0.8
  port_along_mm: 30.0
  slide_mm: 32.0
bounds:
  cov_h_deg: {lo: 75, hi: 95}
  cov_v_deg: {lo: 50, hi: 80}
  z_frac: {lo: 0.0, hi: 0.7}
  across_frac: {lo: 0.35, hi: 0.9}
  port_along_mm: {lo: 12, hi: 35}
  slide_mm: {lo: -10, hi: 40}
mesh:
  epw: 4.05              # smallest mesh whose source patches still resolve 12 kHz (4.0 = 11.93 kHz,
                         # 4.2 = 8,625 dofs and a 7.9/8.19 GB peak that killed the sweep)
  quadrants: '1'           # the meh STEP is a QUARTER open shell (C2)
  dof_cap_screen: 8200   # contracted 41-frequency band at epw 4.05 (~8.0k dofs, ~15 % less VRAM)
  dof_cap_verify: 9000
  dof_cap_final: 9000
  dof_per_triangle: 0.51   # TOOLCHAIN M1: measured ~0.51 quarter
solve:
  backend: beat_cuda
  # NB: cuda_fused cannot do a MEH solve - HORNLAB_BEAT_FUSED_BM_CUDA refuses >1 channel.
  # The unfused 8,625-dof mesh needs ~7.9 of the 8 GB card, which a 41-frequency sweep
  # cannot survive (CUDA 719, measured twice), so the screen cap below buys the headroom.
  # MEH contract C11/M7: score the brief's own 120-12,000 Hz band at 1/6 octave
  # (41 points). Opt-in: absent in every other config, so no existing solve hash moves.
  freq_grid: {lo_hz: 120, hi_hz: 12000, points_per_octave: 6}
  # 41 frequencies grow the persistent host past the 8 GB card's ceiling (measured: CUDA
  # 719 at 7,908 MiB). Recycle the host every 8 solved frequencies; opt-in only.
  worker_restart_every: 8
  distance_m: 2.0
  angle_count: 73
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-05
  timeout_s: 1800
search:
  algorithm: cma
  sigma0: 0.2
  seed: 1234
  budget: 40
  popsize: null
  tolfun: 0.001
