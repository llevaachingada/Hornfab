# perturbed_osse_hv: OSSE H and V (separate coverage) with monotone increment perturbation, rounded-rectangle mouth
# Typology generator config (docs/TYPOLOGY_PLAN.md s4). Knobs in mm / Hz / deg; the brief
# fixes the driver exit (throat radius and angle), the size envelope, target and weights.
# Magnus's mesher builds the surface from FREEFORM anchors [z, r, wall angle].
name: perturbed_osse_hv
family: FREEFORM
brief_file: ../briefs/hifi_90x60_1in.yaml
generator:
  name: typology
  profile_h:
    type: osse
  profile_v:
    type: osse
  perturb:
    u_max: 0.25
  n_anchors: 8
  max_wall_deg: 80.0
  mouth: rounded_rectangle
