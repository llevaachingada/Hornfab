# WIDE-RANGE RADIAL RELIEF ON THE CROWE-ES SPIRAL BASE (2026-11-15 owner study).
# Same rolled-rectangle base as hl__rolled_es_spiral_v7, but the relief is the
# canonical rolled_family RADIAL mode, not the legacy axial pucker:
#   rho_new = rho - (H*cos^2(psi) + V*sin^2(psi)) * cos^2(2*psi) * window
# Positive H/V pull the horizontal/vertical wall centres inward; the normalized
# diagonal is unchanged. That is the ATH-like diagonal ridge / triangular facet
# direction. Negative H/V would push the axes outward (diagonal valley); that is
# a separate visual experiment and is not expressible with the current v1 mode.
# Window 0.50/0.80/0.96 keeps the source and the returned lip untouched.
# W/H/depth/decay/terminal deliberately match the current spiral cell so the
# comparison isolates the relief mechanism.
name: rf__rect_radial_wide_v7
family: FREEFORM
brief_file: ../../briefs/home_landscape_2026-11-15/room_landscape_80x50_700_hf1440_v7.yaml
