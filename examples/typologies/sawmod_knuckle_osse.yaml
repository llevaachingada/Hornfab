# sawmod_knuckle_osse: SAWMOD whitepaper WG WITH S2 superformula knuckles.
#
# PRIMARY: SAWMOD Whitepaper §3.1 (John White, 2026-04-07) — Gielis SF at S2 digitized
# from the published equation figure:
#   r(θ)=(|cos(mθ/4)/a|^n2 + |sin(mθ/4)/b|^n3)^(-1/n1)
#   a=1, b=1.2, m=4, n1=1.5, n2=14, n3=2.5
# OS-SE pins same as control; morph rate 4 → 100×70 rectangle; gcurve_dist = S2/L
# = 53.5/115. CD-only (no mid ports yet). All knobs search:false.
#
# DOSSIER: docs/research/typologies/SAWMOD_CONTROL_WAVEGUIDE_2026-11-01.md (+ phase-2 addendum)
name: sawmod_knuckle_osse
family: OSSE
brief_file: ../briefs/sawmod_control_1in_100x70.yaml

seed_params:
  r0_mm: 12.7
  a0_deg: 0.0
  L_mm: 115.0
  a_deg: 50.0
  n: 4.0
  s: 0.8
  q: 0.996
  k: 1.0
  exponent: 2.0                 # mesher: circular section required with gcurve
  aspect_ratio: 1.0
  s1: 0.0                       # gcurve forbids throat stretch
  s2: 0.0
  gcurve_type: 2                # superformula
  gcurve_width_mm: 120.0        # S2 bounding width (text gap; tune if mesh refuses)
  gcurve_aspect_ratio: 0.7      # 70/100 coverage aspect
  gcurve_dist: 0.465            # S2 @ 53.5 mm / L 115
  gcurve_rot_deg: 0.0
  gcurve_sf_a: 1.0
