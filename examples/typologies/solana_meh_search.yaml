# Solana 2.0 MEH SEARCH — same drivers/envelope as solana_meh.yaml, C9 knobs free.
#
# Primary source: DIY Guide Rev 2.0 (docs/research/typologies/SOLANA_WAVEGUIDE_2026-11-01.md).
# Screen uses a shortened freq grid vs the full 41-pt MEH contract band so a 24 GB
# card can iterate; verify can widen later.
name: solana_meh_search
family: FREEFORM
brief_file: ../briefs/solana_meh_1in_90x90.yaml
generator:
  name: meh
  seed_policy: explicit
  fixed:
    walls: tblr
    env_w_mm: 450.0          # DIY face 410; 450 needed for 4x6.5 @ 90x90 in MEH CAD
    env_h_mm: 450.0
    env_d_mm: 340.0
    box_t_mm: 18.0
    roll_mm: 20.0
    wall_t_mm: 6.0
    spacer_mm: 3.0
    exit_mm: 25.4            # B&C DH450
    cd_duct_mm: 25.0
    cd_body_d_mm: 69.0
    cd_body_len_mm: 48.0
    cone_cutout_mm: 145.0    # B&C 6NDL38
    cone_depth_mm: 85.0
    clearance_mm: 3.0
seed_params:
  cov_h_deg: 90.0
  cov_v_deg: 90.0
  z_frac: 0.35
  across_frac: 0.4
  port_along_mm: 25.0
  slide_mm: 30.0
bounds:
  cov_h_deg: {lo: 75, hi: 95}
  cov_v_deg: {lo: 75, hi: 95}
  z_frac: {lo: 0.2, hi: 0.55}
  across_frac: {lo: 0.35, hi: 0.7}
  port_along_mm: {lo: 12, hi: 35}
  slide_mm: {lo: 10, hi: 40}
mesh:
  epw: 4.2
  quadrants: '1'
  dof_cap_screen: 12000
  dof_cap_verify: 14000
  dof_cap_final: 14000
  dof_per_triangle: 0.51
solve:
  backend: beat_cuda
  freq_grid: {lo_hz: 100, hi_hz: 10000, points_per_octave: 4}
  worker_restart_every: 8
  distance_m: 2.0
  angle_count: 73
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-05
  timeout_s: 1800
search:
  algorithm: cma
  sigma0: 0.2
  seed: 1234
  budget: 40
  popsize: null
  tolfun: 0.001
