# lands ~450x450 mm vs the published 353x353 morph target (docs/evidence/SOLANA_WG_2026-11-01.md);
# MEH/source/baffle also differ. Comment only: parsed config and config_sha unchanged.
#
# PRIMARY: Solana DIY Guide Rev 2.0 (John White, 2026-08-31) + athscript.cfg in
#   docs/research/typologies/solana_2026-11-01/
# DOSSIER: docs/research/typologies/SOLANA_WAVEGUIDE_2026-11-01.md
#
# Pins verbatim from athscript.cfg (OS-SE + Gielis SF m=8 + morph to 353×353).
# a_deg is NOT in the Ath script — default 45 (half of 90° CD). CD-only; mid
# ports / enclosure / 6NDL38 loading are phase 2+. All knobs search:false.
