# solana_osse_sf_search: Solana Ath WG with searchable SF / guiding-curve + morph.
# REV2 LABEL (2026-11-13): SOLANA-INSPIRED, not a matched Solana 2.0 replica. The athscript-keyed mesh
# lands ~450x450 mm vs the published 353x353 morph target (docs/evidence/SOLANA_WG_2026-11-01.md);
# MEH/source/baffle also differ. Comment only: parsed config and config_sha unchanged.
#
# PURPOSE: CMA over the Ath OS-SE + GCurve.SF + Morph knobs that actually define
# the Solana waveguide. The MEH CAD pyramid (solana_meh*) cannot express SF /
# superellipse gcurve — those are native OSSE mesher keys.
#
# Seed = Advanced/athscript.cfg (docs/research/typologies/solana_2026-11-01/).
# Dossier: docs/research/typologies/SOLANA_WAVEGUIDE_2026-11-01.md
# SF quarter rules: docs/research/ATH_SUPERFORMULA_AND_GSA_2026-10-25.md
#   (m multiple of 4; m1=m2 for quarter meshes) — m pinned at Ath's 8.
#
# CD-only freestanding (solana_control brief). Midports / multi-entry MEH still
# need Ath morph + ports as one solid (out of scope); do not confuse with
# solana_meh CAD.
#
# Mouth delta with SF engaged (~450 vs Ath morph 353) is disclosed in dossier §4.
name: solana_osse_sf_search
family: OSSE
brief_file: ../briefs/solana_control_1in_90x90.yaml

seed_params:
  r0_mm: 12.7
  a0_deg: 0.0
  L_mm: 140.0
  a_deg: 45.0
  n: 4.948341464
  s: 1.165551339
  q: 0.8006927592
  k: 2.326215907
  exponent: 2.0               # circular section required with gcurve
  aspect_ratio: 1.0
  s1: 0.0
  s2: 0.0
  gcurve_type: 2              # superformula
  gcurve_width_mm: 64.69512195
  gcurve_aspect_ratio: 1.0
  gcurve_dist: 0.2776715106
  gcurve_rot_deg: 0.0
  gcurve_sf_a: 1.375827392
  gcurve_sf_b: 1.437994835
  gcurve_sf_m1: 8.0
  gcurve_sf_m2: 8.0
  gcurve_sf_n1: 2.152737774
  gcurve_sf_n2: 5.245161223
  gcurve_sf_n3: 3.01531782
  morph_target: 1
  morph_width_mm: 353.0
  morph_height_mm: 353.0
  morph_corner_mm: 14.0
  morph_exponent: 4.0
  morph_rate: 3.693701077
  morph_fixed: 0.3455704293
  morph_allow_shrinkage: 1

bounds:
  # Driver / section locked for gcurve + round coupling
  r0_mm: {lo: 12.7, hi: 12.7, search: false}
  a0_deg: {lo: 0.0, hi: 0.0, search: false}
  exponent: {lo: 2.0, hi: 2.0, search: false}
  aspect_ratio: {lo: 1.0, hi: 1.0, search: false}
  s1: {lo: 0.0, hi: 0.0, search: false}
  s2: {lo: 0.0, hi: 0.0, search: false}
  gcurve_type: {lo: 2, hi: 2, search: false}
  gcurve_aspect_ratio: {lo: 1.0, hi: 1.0, search: false}
  gcurve_rot_deg: {lo: 0.0, hi: 0.0, search: false}
  gcurve_sf_m1: {lo: 8.0, hi: 8.0, search: false}   # Ath m=8; quarter needs m1=m2 ∈ {4,8,12}
  gcurve_sf_m2: {lo: 8.0, hi: 8.0, search: false}
  morph_target: {lo: 1, hi: 1, search: false}
  morph_exponent: {lo: 4.0, hi: 4.0, search: false}
  morph_allow_shrinkage: {lo: 1, hi: 1, search: false}

  # OS-SE profile
  L_mm: {lo: 120.0, hi: 180.0}
  a_deg: {lo: 35.0, hi: 55.0}
  n: {lo: 3.5, hi: 7.0}
  s: {lo: 0.6, hi: 1.4}
  q: {lo: 0.7, hi: 0.95}
  k: {lo: 1.5, hi: 3.0}

  # Guiding curve (SF + placement)
  gcurve_width_mm: {lo: 40.0, hi: 90.0}
  gcurve_dist: {lo: 0.15, hi: 0.45}
  gcurve_sf_a: {lo: 0.9, hi: 1.8}
  gcurve_sf_b: {lo: 0.9, hi: 1.8}
  gcurve_sf_n1: {lo: 1.2, hi: 4.0}
  gcurve_sf_n2: {lo: 2.0, hi: 10.0}
  gcurve_sf_n3: {lo: 1.5, hi: 6.0}

  # Morph mouth
  morph_width_mm: {lo: 300.0, hi: 420.0}
  morph_height_mm: {lo: 300.0, hi: 420.0}
  morph_corner_mm: {lo: 6.0, hi: 30.0}
  morph_rate: {lo: 2.0, hi: 6.0}
  morph_fixed: {lo: 0.0, hi: 0.5}

target:
  coverage_h_deg: 90.0
  coverage_v_deg: 90.0
  band_lo_hz: 500.0
  band_hi_hz: 8000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 700.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.0
objective:
  version: 3
mesh:
  epw: 6.0
  quadrants: "1"
  dof_cap_screen: 10000
  dof_cap_verify: 14000
  dof_cap_final: 14000
  dof_per_triangle: 0.51
solve:
  backend: beat_cuda
  cuda_fused: true
  distance_m: 2.0
  angle_count: 73
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-05
  timeout_s: 1800
  worker_restart_every: 10
search:
  algorithm: cma
  sigma0: 0.2
  seed: 1234
  budget: 40
  popsize: null
  tolfun: 0.001
description: >
  Solana Ath OS-SE + SF gcurve + morph CMA (CD-only). Searches SF n/a/b, gcurve
  width/dist, OS-SE terms, morph mouth. m=8 pinned. Not MEH CAD; not midports.
