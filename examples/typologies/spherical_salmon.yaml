# spherical_salmon: spherical-wavefront Salmon horn (neutral G4 name), axisymmetric
# WP9 G4 in docs/research/senior_pass_2026-10-24/04_IMPLEMENTATION_PLAN.md (step 3) and
# docs/research/typologies/WP9_WP9B_GROUNDING_2026-10-25.md section 2.3.
# Salmon area law A(s) = A0 (cosh(s/x0) + T sinh(s/x0))^2 with x0 = c / (2 pi fc), applied
# to spherical caps normal to the wall; 0.25 mm march, stop at h_max_wall_deg.
# Neutral name: this is NOT a claim on the published JMLC construction (R9 rename gate).
# (2026-10-25 corrections pass: lecleach / spherical_wave are LIVE per the owner directive -
# the R9-J gate passed at 0.00 mm; the old "stay disabled" wording here was stale, see
# docs/research/typologies/JMLC_LECLEACH_RESEARCH_2026-10-25.md and 12_RESEARCH_BASIS s13.4.)
# L_mm is required by materialize and may only
# SHORTEN the intrinsic march length (tractrix precedent).
# Knob ranges per dossier section 4 for 1-inch briefs: fc 600-1200 Hz, T 0.3-1.0,
# stop/max_wall [60, 88] (FREEFORM needs < 90).
name: spherical_salmon
family: FREEFORM
brief_file: ../briefs/axi_90x90_1in.yaml
generator:
  name: typology
  profile_h:
    type: spherical_salmon
  profile_v: same
  n_anchors: 16
  max_wall_deg: 88.0       # anchor clamp; the march stop is the h_max_wall_deg knob
  mouth: ellipse
seed_params:
  L_mm: 220.0              # upper bound: the march length may only be shortened
  h_fc_hz: 800.0
  h_T: 0.8
  h_max_wall_deg: 80.0
bounds:
  h_fc_hz:
    lo: 600.0
    hi: 1200.0
  h_T:
    lo: 0.3
    hi: 1.0
  h_max_wall_deg:
    lo: 60.0
    hi: 88.0
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 90.0
  band_lo_hz: 700.0
  band_hi_hz: 5500.0
  di_target_db: null
  di_slope_target: 0.0
weights:
  cov: 1.0
  rip: 1.0
  di: 0.3
  dislope: 0.5
  flat: 0.5
  load: 0.0
mesh:
  epw: 8.0  # beta C2 2026-10-22: epw 6 vs 8 on osse_axi gave DI 0.124 dB > 0.1 dB; axi cost unchanged (docs/evidence/BETA_READINESS.md)
  quadrants: '1'
  dof_cap_screen: 5000
  dof_cap_verify: 7000
  dof_cap_final: 8900
  dof_per_triangle: 0.51
solve:
  backend: beat_cuda
  distance_m: 2.0
  angle_count: 73
  balloon: true
  balloon_points_screen: 512
  balloon_points_verify: 1024
  gmres_tol: 1.0e-05
  timeout_s: 900
search:
  algorithm: cma
  sigma0: 0.25
  seed: 1234
  budget: 200
  popsize: null
  tolfun: 0.001
