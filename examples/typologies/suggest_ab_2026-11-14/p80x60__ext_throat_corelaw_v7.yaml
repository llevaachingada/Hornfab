# field at verify (ath_a1_core vs ath_a0_control: diag 2.06 -> 0.68, J 11.4 -> 6.2 on the 2-in 50x50 brief); the
# cosine-only notch and the lip-ripple (S) family did NOT. 'ATH CORE-style', not a claimed ATH product.
# NESTED DESIGN: seed = the incumbent's searched knobs with every law amplitude 0, so the cell can match 3.2325; if the
# five seeds leave the amplitudes near 0, the law does not help this brief (a real negative).
# Superformula SHAPE pinned at the g1 atlas__core_law best (n1 7.50, n2 12.44, n3 13.44, b 0.857, m 4; permutation
# importance ~0 in the 12 Nov report): SF(p) = 1.00 / 1.38 / 0.76 at p = 0 / 45 / 90 deg. The three searched
# amplitudes use the report's item-5 narrowed boxes. a_deg lo 30 -> 15 so the base can drop while the law adds angle.
# r0/a0 stay derived per design (search/evaluate.py::_derive_throat_coupling). ~5-8 % of the box is a(p)-invalid
# (cheap graded refusal, sampled offline). Five seeds share THIS FILE via --cma-seed (seed and budget are stripped
# from the task identity), so the runs form one seed-variance group and one BO cohort.
