# both converged to J 3.2325 / 3.2328 = the INCUMBENT). This cell adds the ATH CORE-style per-direction law
# (hornlab_search/design/families.py "azlaw"):
#   a(p) = a_deg + az_a_sf_amp*SF(p) + az_a_cos_amp*|cos p|^pow,   s(p) = s + az_s_cos2_amp*cos^2 p.
