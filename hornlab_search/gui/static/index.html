<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hornlab-search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&family=Spline+Sans:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">

  <!-- Three.js r160 via importmap (CDN) -->
  <script type="importmap">
  {
    "imports": {
      "three":                              "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>

<div id="app-shell">

  <!-- Left / top navigation -->
  <nav id="app-nav" aria-label="Main navigation">
    <div class="nav-brand">
      hornlab
      <small>search</small>
    </div>
    <ul>
      <li><a href="#/home"      aria-label="Home"><span class="icon" aria-hidden="true">⌂</span>Home</a></li>
      <li><a href="#/status"    aria-label="Status"><span class="icon" aria-hidden="true">◉</span>Status</a></li>
      <li><a href="#/campaigns" aria-label="Campaigns"><span class="icon" aria-hidden="true">◈</span>Campaigns</a></li>
      <li><a href="#/runs"      aria-label="Runs"><span class="icon" aria-hidden="true">▷</span>Runs</a></li>
      <li><a href="#/compare"   aria-label="Compare"><span class="icon" aria-hidden="true">⇄</span>Compare</a></li>
      <li><a href="#/briefs"    aria-label="Briefs"><span class="icon" aria-hidden="true">◎</span>Briefs</a></li>
      <li><a href="#/typologies" aria-label="Typologies"><span class="icon" aria-hidden="true">◇</span>Typologies</a></li>
      <li><a href="#/compose" aria-label="Compose"><span class="icon" aria-hidden="true">⊕</span>Compose</a></li>
      <li><a href="#/launch"    aria-label="Launch"><span class="icon" aria-hidden="true">▶</span>Launch</a></li>
    </ul>
    <div class="nav-spacer"></div>
    <div class="nav-footer">
      <a href="#/glossary" class="glossary-link" aria-label="Glossary">? Glossary</a>
      <button id="btn-theme" aria-label="Toggle dark/light mode" title="Toggle dark/light mode">
        <span id="theme-icon">◑</span>
      </button>
    </div>
  </nav>

  <!-- Main content area -->
  <main id="app-main">
    <div id="view-root" role="main">
      <p class="muted">Loading…</p>
    </div>
  </main>

</div>

<script type="module">
  // ── Theme boot + toggle ──────────────────────────────────────────
  (function () {
    const doc = document.documentElement;
    const savePref = t => { try { localStorage.setItem("hl-theme", t); } catch {} };

    // 1. ?theme=light|dark capture override — persists exactly like a click.
    const fromUrl = new URLSearchParams(location.search).get("theme");
    if (fromUrl === "light" || fromUrl === "dark") {
      doc.setAttribute("data-theme", fromUrl);
      savePref(fromUrl);
    }

    // 2. Stored preference.
    let stored = null;
    try { stored = localStorage.getItem("hl-theme"); } catch {}
    if (stored === "light" || stored === "dark") doc.setAttribute("data-theme", stored);

    // 3. OS fallback — used when nothing is pinned yet, and by the toggle so the
    //    first click always flips away from the theme actually on screen.
    const prefersDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
    const icon = document.getElementById("theme-icon");
    function setIcon() {
      const t = doc.getAttribute("data-theme") || (prefersDark() ? "dark" : "light");
      icon.textContent = t === "dark" ? "☀" : "◑";
    }
    setIcon();

    // 4. Toggle: always writes the explicit attribute + preference.
    document.getElementById("btn-theme").addEventListener("click", () => {
      const cur = doc.getAttribute("data-theme");
      const eff = cur || (prefersDark() ? "dark" : "light");
      const next = eff === "dark" ? "light" : "dark";
      doc.setAttribute("data-theme", next);
      savePref(next);
      setIcon();
    });
  })();
</script>

<script type="module" src="app.js"></script>

</body>
</html>
