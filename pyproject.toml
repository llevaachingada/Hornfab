[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hornlab-search"
version = "0.1.0"
description = "Objective-driven horn geometry search over the HornLab BEM stack"
requires-python = ">=3.11,<3.14"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "cma>=3.3",
  "pyyaml>=6",
  "jinja2>=3.1",
  "hornlab-waveguide-mesher @ git+https://github.com/m3gnus/hornlab-waveguide-mesher.git@b922e807a5cf10cf732c4557ec0b9b495762afd7",
  # M2 2026-10-24: WP15 fused CUDA fork, installed+validated @ fa99ee5 (branch hornlab-search/fused-cuda).
  # DEV BRANCH ONLY (dev/fused-cuda-pin): a file:// URL must NEVER reach main. Hosted-GitHub URL
  # replacing this line is an OWNER ACTION (docs/FORKS.md step 5; CONTINUITY 2026-10-24 owner asks).
  "hornlab-beat-bem @ git+file:///C:/Users/hunte/Hrns/forks/hornlab-beat-bem@fa99ee594087507c2808b9e7db09b38d8d4dcc20",
  "hornlab-plots @ git+https://github.com/m3gnus/hornlab-plots.git@9e4a6d0dd2ccb6e735dd00233dccccb50d12ed44",
]

[project.optional-dependencies]
crosscheck = ["hornlab-bempp-bem @ git+https://github.com/m3gnus/hornlab-bempp-bem.git@8e6910602ece9abb2e9ce0db7a637f4bedf17f53"]
dev = ["pytest>=8", "pytest-timeout"]
surrogate = ["torch>=2.2"]

[project.scripts]
hornlab-search = "hornlab_search.cli:main"

[tool.setuptools.packages.find]
include = ["hornlab_search*"]

[tool.setuptools.package-data]
"hornlab_search.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 900
markers = [
  "slow: needs a real BEM solve",
  "gpu: needs a working CUDA backend",
  "crosscheck: needs hornlab-bempp-bem",
]
addopts = "-ra -q"
