[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hornlab-search"
version = "0.1.0"
description = "Objective-driven horn geometry search over the HornLab BEM stack"
requires-python = ">=3.11,<3.14"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "cma>=3.3",
  "pyyaml>=6",
  "jinja2>=3.1",
  # OSSE mid_ports (tag 10) fork: hornlab-search/osse-midports @ 55da4f4 (base b922e807).
  "hornlab-waveguide-mesher @ git+https://github.com/jamescollinharky/hornlab-waveguide-mesher.git@55da4f46d662d8dcd7a9f94a609eeea4009fcd62",
  # WP16+17 fork stack, hosted fork (docs/FORKS.md): WP15 fused CUDA Burton-Miller + WP16 J0 source
  # profile + WP17 fused-CUDA near correction (stage 1), all opt-in at their defaults.
  "hornlab-beat-bem @ git+https://github.com/llevaachingada/hornlab-beat-bem.git@38e5b1f8ca840ebf6351c54611a08fedb1a0750f",
  "hornlab-plots @ git+https://github.com/m3gnus/hornlab-plots.git@9e4a6d0dd2ccb6e735dd00233dccccb50d12ed44",
]

[project.optional-dependencies]
crosscheck = ["hornlab-bempp-bem @ git+https://github.com/m3gnus/hornlab-bempp-bem.git@8e6910602ece9abb2e9ce0db7a637f4bedf17f53"]
dev = ["pytest>=8", "pytest-timeout", "pytest-xdist>=3"]
surrogate = ["torch>=2.2"]
# bo-study-v1.1 advisory Bayesian engine (B3/M2). Optional and lazily imported; the normal GUI/CMA
# startup must work when this extra is absent. The sanctioned offline engine is the isolated
# bayes-venv recorded in docs/research/bo_study/PARENT_M0_FREEZE.md section 6.
bayes = [
  "torch>=2.2",
  "botorch==0.18.1",
  "gpytorch==1.15.2",
  "linear_operator==0.6.1",
]
# WP11b CMA-ME atlas. The PyPI distribution is `ribs` (`import ribs`); `pyribs` is an alias that
# does not resolve, so pin the import name exactly.
qd = ["ribs==0.12.0"]
# tools/analysis/parameter_study.py fit_effects (held-out effect screening) uses scikit-learn;
# without it the fit reports status "unavailable" instead of producing effects.
analysis = ["scikit-learn>=1.3"]
# WP14 optional dep: tools/cad/multicell.py builds the multicell air volume and needs OCP.
cad = ["build123d==0.13.0"]

[project.scripts]
hornlab-search = "hornlab_search.cli:main"

[tool.setuptools.packages.find]
include = ["hornlab_search*"]

[tool.setuptools.package-data]
"hornlab_search.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 900
markers = [
  "slow: needs a real BEM solve",
  "gpu: needs a working CUDA backend",
  "crosscheck: needs hornlab-bempp-bem",
]
addopts = "-ra -q"
